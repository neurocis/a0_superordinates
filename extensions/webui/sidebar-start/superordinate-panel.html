<html>
<head>
  <script type="module" src="/plugins/a0_superordinates/webui/superordinate-store.js"></script>
</head>
<body>
  <div
    x-data="{
      _flatTree: [],
      showSuperordinatesLicense: false,
      superordinatesLicenseText: '',
      superordinatesLicenseLoading: false,
      superordinatesLicenseError: '',
      async openSuperordinatesLicense() {
        this.showSuperordinatesLicense = true;
        if (this.superordinatesLicenseText || this.superordinatesLicenseLoading) return;
        this.superordinatesLicenseLoading = true;
        this.superordinatesLicenseError = '';
        try {
          const response = await fetch('https://neurocis.ai/superordinates/LICENSE', { cache: 'no-cache' });
          if (!response.ok) throw new Error(`Failed to load LICENSE (${response.status})`);
          this.superordinatesLicenseText = await response.text();
        } catch (error) {
          this.superordinatesLicenseError = error?.message || 'Failed to load LICENSE.';
          this.superordinatesLicenseText = 'MIT License with Attribution\n\nCopyright (c) 2025 neurocis\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the &quot;Software&quot;), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\n1. The above copyright notice, this permission notice, and the attribution\n   requirement below shall be included in all copies or substantial portions\n   of the Software.\n\n2. Attribution Requirement: Any distribution, public deployment, user-facing\n   interface, documentation, marketing material, or derivative work that uses,\n   includes, incorporates, or is based on the Software must prominently display\n   both of the following attribution notices:\n\n   Superordinates\n   Built (w/care) by neurocis.ai\n\n   The attribution notices must be reasonably visible to end users or readers\n   and must not be hidden, removed, obscured, or presented in a manner that\n   implies endorsement by neurocis.ai unless such endorsement has been granted\n   separately in writing.\n\n   Licensed removal of attribution is available, please reach out to licensing@neurocis.ai for more information.\n\nTHE SOFTWARE IS PROVIDED &quot;AS IS&quot;, WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.\n';
        } finally {
          this.superordinatesLicenseLoading = false;
        }
      },
      closeSuperordinatesLicense() {
        this.showSuperordinatesLicense = false;
      },
      async openSuperordinatesConfig() {
        try {
          const module = await import('/components/plugins/plugin-settings-store.js');
          const pluginSettingsStore = module?.store || window.Alpine?.store?.('pluginSettings');
          if (!pluginSettingsStore?.openConfig) throw new Error('Plugin settings store is unavailable.');
          await pluginSettingsStore.openConfig('a0_superordinates');
        } catch (error) {
          console.error('[Superordinates] Failed to open config modal:', error);
          window.showErrorNotification?.(error, 'Failed to open A0 Superordinates config');
        }
      }
    }"
    x-move-after="#chats-section"
    x-effect="_flatTree = $store.superordinates?.getFlatTree($store.chats?.contexts) || []; $store.superordinates?._cancelStaticNameRenameIfNeeded()"
    @keydown.escape.window="closeSuperordinatesLicense()"
    class="superordinate-section">
    <template x-if="$store.superordinates && $store.chats">
      <div class="superordinate-inner">
        <div class="section-header-row superordinate-header-row">
          <div class="superordinate-license-wrap">
            <button
              type="button"
              class="section-header superordinate-license-trigger"
              @click.stop="openSuperordinatesLicense()"
              @keydown.enter.prevent.stop="openSuperordinatesLicense()"
              @keydown.space.prevent.stop="openSuperordinatesLicense()"
              aria-label="Open Superordinates license"
              :aria-expanded="showSuperordinatesLicense.toString()"
              aria-controls="superordinates-license-modal"
              title="Built w/care by neurocis.ai in Canada."
            >Superordinates ⓘ</button>
            <button
              type="button"
              class="superordinate-config-trigger"
              @click.stop="openSuperordinatesConfig()"
              @keydown.enter.prevent.stop="openSuperordinatesConfig()"
              @keydown.space.prevent.stop="openSuperordinatesConfig()"
              aria-label="Open A0 Superordinates settings"
              title="Open A0 Superordinates settings"
            >
              <span class="material-symbols-outlined" aria-hidden="true">settings</span>
            </button>
          </div>
          <button class="btn-icon-action chat-list-action-btn" @click="$store.superordinates.newChat()" aria-label="Onboard" title="Onboard">
            <span class="material-symbols-outlined">chat_add_on</span>
          </button>
        </div>
        <div
          x-cloak
          x-show="showSuperordinatesLicense"
          x-transition.opacity.duration.140ms
          id="superordinates-license-modal"
          class="superordinate-license-modal-backdrop"
          role="presentation"
          @click.self="closeSuperordinatesLicense()"
        >
          <div
            class="superordinate-license-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="superordinates-license-modal-title"
            @click.stop
          >
            <div class="superordinate-license-modal-header">
              <div>
                <h2 id="superordinates-license-modal-title">A0 Superordinates LICENSE</h2>
                <p>Built w/care by neurocis.ai in Canada.</p>
              </div>
              <button
                type="button"
                class="superordinate-license-modal-close"
                @click="closeSuperordinatesLicense()"
                aria-label="Close Superordinates license"
                title="Close"
              >×</button>
            </div>
            <div class="superordinate-license-modal-body">
              <div class="superordinate-license-loading" x-show="superordinatesLicenseLoading">Loading LICENSE…</div>
              <div class="superordinate-license-error" x-show="superordinatesLicenseError" x-text="superordinatesLicenseError"></div>
              <pre class="superordinate-license-text" x-text="superordinatesLicenseText"></pre>
            </div>
          </div>
        </div>
        <ul class="config-list chats-config-list superordinate-tree"
          x-show="$store.chats.contexts.length > 0"
          @dragover.prevent.stop="">
          <template x-for="node in _flatTree" :key="node.id">
            <li :style="{ paddingLeft: (node._depth * 16) + 'px' }"
              class="tree-item"
              :class="$store.superordinates.getDropClass(node.id)"
              :draggable="!$store.superordinates.isMoveLocked(node.id)"
              @dragstart.stop="$store.superordinates.dragStart(node.id, $event)"
              @dragover.prevent.stop="$store.superordinates.dragOver(node.id, $event)"
              @dragleave="$store.superordinates.dragLeave(node.id, $event)"
              @drop.prevent.stop="$store.superordinates.drop(node.id, $event, _flatTree)"
              @dragend.stop="$store.superordinates.dragEnd($event)">
              <div :class="{'chat-container': true, 'chat-selected': node.id === $store.chats.selected}"
                @click="$store.chats.selectChat(node.id)">
                <div class="chat-list-button">
                  <!-- Triangle indicator for nodes with children -->
                  <template x-if="node._hasChildren">
                    <span class="tree-toggle-indicator"
                      :style="Object.assign({}, node.project?.color ? { color: node.project.color } : { color: 'var(--color-border)' }, { transform: node._isExpanded ? 'rotate(0deg)' : 'rotate(-90deg)' })"
                      @click.stop="$store.superordinates.toggleExpand(node.id, $event)"
                      >&#x25BC;</span>
                  </template>
                  <!-- Dot indicator for leaf nodes (same as original) -->
                  <template x-if="!node._hasChildren">
                    <span :class="{'project-color-ball': true, 'heartbeat': node.running}"
                      :style="node.project?.color ? { backgroundColor: node.project.color } : { border: '1px solid var(--color-border)' }"></span>
                  </template>
                  <!-- Name: show span or inline rename input -->
                  <template x-if="$store.superordinates.renamingId !== node.id || !$store.superordinates.canRename(node.id)">
                    <span class="sup-name-row sup-name-clickable"
                      :class="{ 'sup-static-name': !$store.superordinates.canRename(node.id) }"
                      :title="$store.superordinates.displayNameWithIndicators(node) + ($store.superordinates.nodeIndicatorTitle(node) ? ' — ' + $store.superordinates.nodeIndicatorTitle(node) : '')"
                      @click.stop="$store.superordinates.canRename(node.id) ? $store.superordinates.handleNameClick(node.id, node.name || ('Chat #' + node.no), $event) : $store.chats.selectChat(node.id)"
                      @dblclick.stop="$store.superordinates.canRename(node.id) ? $store.superordinates.handleNameDblClick(node.id, $event) : $store.chats.selectChat(node.id)">
                      <span class="chat-name sup-name-summary">
                        <span class="sup-name-text" x-text="$store.superordinates.displayNameBase(node)"></span><sup class="sup-inheritance-indicator" x-show="$store.superordinates.nodeInheritanceIndicatorIcon(node)" x-text="$store.superordinates.nodeInheritanceIndicatorIcon(node)"></sup>
                      </span>
                      <span class="sup-name-indicators" x-show="$store.superordinates.nodeRightIndicatorIcons(node).length" x-text="$store.superordinates.nodeRightIndicatorIcons(node).join(' ')"></span>
                    </span>
                  </template>
                  <template x-if="$store.superordinates.renamingId === node.id && $store.superordinates.canRename(node.id)">
                    <input type="text" class="sup-rename-input"
                      x-model="$store.superordinates.renamingValue"
                      @keydown.enter.stop="$store.superordinates.commitRename()"
                      @keydown.escape.stop="$store.superordinates.cancelRename()"
                      @blur="$store.superordinates.commitRename()"
                      @click.stop />
                  </template>
                </div>
                <!-- Status indicators (independent of Chat Status Marklet) -->
                <span class="sup-running-dot" x-show="node.running" title="Process running"></span>
                <span class="sup-unseen-dot" x-show="!node.running && node._isUnseen" title="Process finished (unseen)"></span>
                <button class="btn-icon-action chat-list-action-btn sup-pin-btn" :class="{ 'sup-pin-active': $store.superordinates.isPinned(node.id) }" :title="$store.superordinates.isPinned(node.id) ? 'Unpin' : 'Pin'" :aria-label="$store.superordinates.isPinned(node.id) ? 'Unpin' : 'Pin'" x-show="!$store.superordinates.isRootLocked(node.id) && !$store.superordinates.isOnboardBlocked(node.id)" @click.stop="$store.superordinates.togglePin(node.id)">
                  <span class="material-symbols-outlined" x-text="$store.superordinates.isPinned(node.id) ? 'keep' : 'keep_off'"></span>
                </button>
                <button class="btn-icon-action chat-list-action-btn sup-msgme-btn" :class="{ 'sup-msgme-blocked': $store.superordinates.isMsgMeBlocked(node.id) }" :title="$store.superordinates.isMsgMeBlocked(node.id) ? 'Make Prompt-able' : 'Make Msgs-Only'" :aria-label="$store.superordinates.isMsgMeBlocked(node.id) ? 'Make Prompt-able' : 'Make Msgs-Only'" x-show="!$store.superordinates.isOnboardBlocked(node.id)" @click.stop="$store.superordinates.toggleMsgMeBlocked(node.id)">
                  <span class="material-symbols-outlined">keyboard</span>
                </button>
                <button class="btn-icon-action chat-list-action-btn sup-onboard-btn" title="Onboard" aria-label="Onboard" x-show="!$store.superordinates.isOnboardBlocked(node.id)" @click.stop="$store.superordinates.onboardChild(node.id)">
                  <span class="material-symbols-outlined">person_add</span>
                </button>
                <button class="btn-icon-action chat-list-action-btn" title="Close" aria-label="Close" @click.stop="$confirmClick($event, () => $store.superordinates.closeChat(node.id))">
                  <span class="material-symbols-outlined">close</span>
                </button>
              </div>
            </li>
          </template>
        </ul>
      </div>
    </template>
  </div>
</body>
</html>

<style>
  /* ── Superordinates LICENSE modal ─────────────────────── */
  .superordinate-header-row {
    position: relative;
  }

  .superordinate-license-wrap {
    min-width: 0;
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
  }

  .superordinate-license-trigger {
    appearance: none;
    border: 0;
    background: transparent;
    color: inherit;
    cursor: pointer;
    padding: 0;
    margin: 0;
    font: inherit;
    text-align: left;
  }

  .superordinate-license-trigger:hover,
  .superordinate-license-trigger:focus-visible {
    color: var(--color-primary, #6aa9ff);
    outline: none;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .superordinate-config-trigger {
    appearance: none;
    width: 1.45rem;
    height: 1.45rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    padding: 0;
    margin: 0;
    font: inherit;
    line-height: 1;
    opacity: 0.78;
  }

  .superordinate-config-trigger .material-symbols-outlined {
    font-size: 1.1rem;
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    line-height: 1;
  }

  .superordinate-config-trigger:hover,
  .superordinate-config-trigger:focus-visible {
    color: var(--color-primary, #6aa9ff);
    background: var(--color-background-hover);
    opacity: 1;
    outline: none;
  }

  .superordinate-license-modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 10050;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1rem, 4vw, 3rem);
    background: rgba(0, 0, 0, 0.58);
    backdrop-filter: blur(2px);
  }

  .superordinate-license-modal {
    width: min(920px, 92vw);
    height: min(760px, 84vh);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: var(--color-text);
    background: var(--color-panel, var(--color-bg));
    border: 1px solid var(--color-border);
    border-radius: 16px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.48);
  }

  .superordinate-license-modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 1.2rem;
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }

  .superordinate-license-modal-header h2 {
    margin: 0;
    font-size: 1.05rem;
    line-height: 1.2;
  }

  .superordinate-license-modal-header p {
    margin: 0.25rem 0 0;
    font-size: 0.78rem;
    opacity: 0.72;
  }

  .superordinate-license-modal-close {
    width: 2rem;
    height: 2rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--color-border);
    border-radius: 999px;
    background: transparent;
    color: var(--color-text);
    cursor: pointer;
    font-size: 1.35rem;
    line-height: 1;
  }

  .superordinate-license-modal-close:hover,
  .superordinate-license-modal-close:focus-visible {
    background: var(--color-background-hover);
    outline: none;
  }

  .superordinate-license-modal-body {
    min-height: 0;
    flex: 1;
    overflow: auto;
    padding: 1rem 1.2rem 1.2rem;
  }

  .superordinate-license-loading,
  .superordinate-license-error {
    margin-bottom: 0.75rem;
    font-size: 0.84rem;
    opacity: 0.78;
  }

  .superordinate-license-error {
    color: #ff7b7b;
  }

  .superordinate-license-text {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    font-size: 0.86rem;
    line-height: 1.5;
  }

  /* ── Status indicator dots ────────────────────────────── */
  .sup-running-dot,
  .sup-unseen-dot {
    display: inline-block;
    flex-shrink: 0;
    border-radius: 50%;
    pointer-events: none;
    margin-right: 4px;
  }

  /* Running: pulsing blue dot */
  .sup-running-dot {
    width: 6px;
    height: 6px;
    background-color: #4361ee;
    box-shadow: 0 0 3px rgba(67, 97, 238, 0.6);
    animation: sup-pulse 1.8s ease-in-out infinite;
  }

  @keyframes sup-pulse {
    0%, 100% {
      opacity: 1;
      transform: scale(1);
    }
    50% {
      opacity: 0.4;
      transform: scale(0.75);
    }
  }

  /* Finished unseen: solid green dot */
  .sup-unseen-dot {
    width: 6px;
    height: 6px;
    background-color: #2a9d8f;
    box-shadow: 0 0 3px rgba(42, 157, 143, 0.5);
  }

  /* Light mode adjustments */
  .light-mode .sup-running-dot {
    background-color: #2540b3;
    box-shadow: 0 0 3px rgba(37, 64, 179, 0.5);
  }

  .light-mode .sup-unseen-dot {
    background-color: #1a6f65;
    box-shadow: 0 0 3px rgba(26, 111, 101, 0.4);
  }

  /* Section wrapper — participates in sidebar flex chain */
  .superordinate-section {
    display: flex;
    flex-direction: column;
    min-height: 0;
    flex: 1 1 auto;
    overflow: hidden;
  }

  /* Tree-specific styles */
  .superordinate-tree {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }

  /* Inner wrapper — must pass flex chain through template x-if */
  .superordinate-inner {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* Header row — matches Chats section-header-row styling */
  .superordinate-inner .section-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    flex-shrink: 0;
    margin-bottom: var(--spacing-xs);
    z-index: 10;
  }

  .superordinate-inner .section-header {
    margin: 0;
  }

  /* Indentation is applied via inline paddingLeft on <li> */
  .tree-item {
    position: relative;
    transition: background-color 0.15s ease;
    cursor: grab;
  }

  .tree-item:active {
    cursor: grabbing;
  }

  /* Dragging state - make the source item semi-transparent */
  .tree-item.dragging {
    opacity: 0.4;
  }

  /* Drop indicator: line ABOVE the target (insert before) */
  .tree-item.drop-before::before {
    content: '';
    position: absolute;
    top: 0;
    left: 4px;
    right: 4px;
    height: 2px;
    background: var(--color-accent, #4a9eff);
    border-radius: 1px;
    z-index: 10;
    pointer-events: none;
  }

  /* Drop indicator: line BELOW the target (insert after) */
  .tree-item.drop-after::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 4px;
    right: 4px;
    height: 2px;
    background: var(--color-accent, #4a9eff);
    border-radius: 1px;
    z-index: 10;
    pointer-events: none;
  }

  /* Drop indicator: highlight for 'nest as child' */
  .tree-item.drop-child {
    background-color: rgba(74, 158, 255, 0.12);
    outline: 1px dashed var(--color-accent, #4a9eff);
    outline-offset: -1px;
    border-radius: 4px;
  }
  /* ── Per-row action buttons overlay on right edge ────────── */
  /* Buttons are absolutely positioned so they sit on top of the
     chat name instead of stealing layout space. When hidden via
     x-show / isOnboardBlocked, the underlying name fills the space. */
  .superordinate-tree .chat-container {
    position: relative;
  }

  .superordinate-tree .chat-container > .btn-icon-action.chat-list-action-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    background: var(--color-panel, var(--color-bg, transparent));
    border-radius: 4px;
    padding: 2px;
  }

  /* Far-right slot: Close button (the action btn that is not pin/onboard/msgme) */
  .superordinate-tree .chat-container > .btn-icon-action.chat-list-action-btn:not(.sup-onboard-btn):not(.sup-pin-btn):not(.sup-msgme-btn) {
    right: 4px;
  }

  /* Onboard button — left of Close */
  .superordinate-tree .chat-container > .sup-onboard-btn {
    right: 30px;
  }

  /* MsgMe button — left of Onboard */
  .superordinate-tree .chat-container > .sup-msgme-btn {
    right: 56px;
    opacity: 0.55;
    transition: opacity 0.15s ease, color 0.15s ease;
  }

  .superordinate-tree .chat-container:hover > .sup-msgme-btn,
  .superordinate-tree .chat-container.chat-selected > .sup-msgme-btn,
  .superordinate-tree .chat-container > .sup-msgme-btn.sup-msgme-blocked {
    opacity: 1;
  }

  /* Active (MsgMe blocked) — red so it's visibly distinct */
  .superordinate-tree .chat-container > .sup-msgme-btn.sup-msgme-blocked {
    color: #e63946;
  }

  /* Pin button — left of MsgMe */
  .superordinate-tree .chat-container > .sup-pin-btn {
    right: 82px;
    opacity: 0.55;
    transition: opacity 0.15s ease;
  }

  .superordinate-tree .chat-container:hover > .sup-pin-btn,
  .superordinate-tree .chat-container.chat-selected > .sup-pin-btn,
  .superordinate-tree .chat-container > .sup-pin-btn.sup-pin-active {
    opacity: 1;
  }

  /* Active (pinned) state — accent color so it's visibly distinct */
  .superordinate-tree .chat-container > .sup-pin-btn.sup-pin-active {
    color: var(--color-accent, #4a9eff);
  }

  /* Disabled prompt input visual cue when MsgMe-blocked is ON for selected chat */
  body.sup-msgme-disabled #chat-input {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* Soft fade behind the buttons so the chat name doesn't visually
     collide with the icons when both occupy the same horizontal band. */
  .superordinate-tree .chat-container::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    right: 0;
    width: 130px;
    background: linear-gradient(
      to right,
      transparent,
      var(--color-panel, var(--color-bg, rgba(0,0,0,0.0))) 70%
    );
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .superordinate-tree .chat-container:hover::after,
  .superordinate-tree .chat-container.chat-selected::after {
    opacity: 1;
  }

  .tree-toggle-indicator {
    cursor: pointer;
    flex-shrink: 0;
    width: 0.6em;
    height: 0.6em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    font-size: 0.85em;
    line-height: 1;
    transition: transform 0.15s ease;
  }

  .tree-toggle-indicator:hover {
    opacity: 0.7;
  }

  /* Ensure chat-list-button gap accounts for indicator */
  .superordinate-tree .chat-list-button {
    gap: 0.35em;
  }

  /* ── Compact line height (≈50% smaller than default Chats) ──── */
  .superordinate-tree .chat-container {
    min-height: 20px;
    padding: 0 5px;
  }

  .superordinate-tree .chat-list-button {
    padding: 3px 5px;
    font-size: 0.88em;
    line-height: 1.35;
  }

  .superordinate-tree .chat-name {
    font-size: 0.88em;
    line-height: 1.35;
  }

  /* Keep each agent row to one visual line. Reserve two compact far-right
     columns: the outermost for processing/complete status, and the next one
     left for calendar indicators. Inheritance stays suffixed to the name as
     a superscript. Action buttons still overlay above both columns on
     hover/selected rows. */
  .superordinate-tree .chat-list-button {
    min-width: 0;
    padding-right: 4.1em;
    box-sizing: border-box;
  }

  .superordinate-tree .sup-name-row {
