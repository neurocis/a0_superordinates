          <div class="a0-sup-inheritance-section-header">

            <span>Read-only, root → focused agent</span>

            <div class="a0-sup-inheritance-muted">No inheritance.md content found in this agent's hierarchy.</div>
          </template>

          <div class="a0-sup-inheritance-entry-list">
            <template x-for="(entry, index) in $store.superordinateInheritance.entries" :key="entry.context_id">
              <article class="a0-sup-inheritance-entry" :class="entry.context_id === $store.superordinateInheritance.ctxid ? 'is-local' : ''">

                <pre class="a0-sup-inheritance-readonly" x-text="entry.text"></pre>
              </article>
            </template>
          </div>
        </section>

          <div class="a0-sup-inheritance-section-header">
            <h3>Focused agent inheritance.md</h3>
            <span x-text="$store.superordinateInheritance.path"></span>

            spellcheck="false"
            x-model="$store.superordinateInheritance.draftText"

            <div class="a0-sup-inheritance-muted" x-show="!$store.superordinateInheritance.hasUnsavedChanges()">Saved</div>

              @click="$store.superordinateInheritance.save()"
              :disabled="$store.superordinateInheritance.saving || !$store.superordinateInheritance.hasUnsavedChanges()"

              <span x-text="$store.superordinateInheritance.saving ? 'Saving…' : 'Save'"></span>
            </button>
          </div>
        </section>
