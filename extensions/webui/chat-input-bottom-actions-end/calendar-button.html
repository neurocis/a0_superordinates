<style>
  .a0-agent-calendar-tab-anchor {
    position: relative;
    display: inline-flex;
    align-items: stretch;
    --a0-calendar-panel-margin: clamp(0.5rem, 1.5vw, 1.25rem);
    --a0-calendar-panel-width: min(1120px, calc(100vw - 2rem));
    --a0-calendar-panel-max-height: min(620px, 66vh);
    --a0-calendar-tab-offset-left: 0px;
  }

  .a0-agent-calendar-tab-anchor > .text-button {
    position: relative;
    z-index: 10002;
  }

  .a0-agent-calendar-tab-anchor > .text-button.a0-agent-calendar-toggle-open {
    opacity: 1;
    background-color: var(--color-background-hover);
    border-radius: 0 0 4px 4px;
  }

  .a0-agent-calendar-host-lifted {
    position: relative;
    z-index: 10002;
    overflow: visible !important;
  }

  .a0-agent-calendar-compose-lifted {
    position: relative;
    z-index: 10002;
    transform: translateY(calc(-1 * var(--a0-calendar-panel-lift, 18rem)));
    transition: transform 180ms ease;
    will-change: transform;
  }

  .a0-agent-calendar-output-lifted {
    transition: height 180ms ease, max-height 180ms ease, padding-bottom 180ms ease, margin-bottom 180ms ease;
  }

  .a0-agent-calendar-panel {
    position: absolute;
    top: auto;
    left: calc(-1 * var(--a0-calendar-tab-offset-left, 0px));
    right: auto;
    bottom: calc(100% - 1px);
    z-index: 10001;
    width: var(--a0-calendar-panel-width, min(1120px, calc(100vw - 2rem)));
    max-width: calc(100vw - 1rem);
    height: var(--a0-calendar-panel-height, auto);
    max-height: var(--a0-calendar-panel-max-height, min(620px, 66vh));
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--border-color, rgba(255,255,255,0.14));
    border-radius: 0.85rem 0.85rem 0 0;
    background: var(--background-primary, #151515);
    color: var(--text-primary, inherit);
    box-shadow: 0 18px 65px rgba(0, 0, 0, 0.42);
    transform-origin: bottom center;
    will-change: transform, opacity;
  }

  .a0-agent-calendar-panel::before {
    content: "";
    position: absolute;
    bottom: -1px;
    left: var(--a0-calendar-tab-left, 0px);
    width: var(--a0-calendar-tab-width, 7rem);
    height: 1px;
    background: var(--background-primary, #151515);
  }
  .a0-agent-calendar-body {
    padding: 0.85rem 1rem 1rem;
    overflow: auto;
  }
  .a0-agent-calendar-muted {
    opacity: 0.72;
    font-size: 0.86rem;
  }

  .a0-agent-calendar-content-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 1rem;
    align-items: start;
  }

  .a0-agent-calendar-section {
    min-width: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    margin-top: 1rem;
  }

  .a0-agent-calendar-section-header {
    margin: 0 0 0.6rem;
  }

  .a0-agent-calendar-heading-context {
    font-weight: 400;
    opacity: 0.78;
  }

  .a0-agent-calendar-files-list {
    flex: 1 1 auto;
  }

  .a0-agent-calendar-section-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin: 0 0 0.6rem;
  }

  .a0-agent-calendar-section-title-row .a0-agent-calendar-section-header {
    margin: 0;
    min-width: 0;
  }

  .a0-agent-calendar-files-actions {
    flex: 0 0 auto;
    justify-content: flex-end;
  }

  .a0-agent-calendar-section:first-child,
  .a0-agent-calendar-content-grid > .a0-agent-calendar-section {
    margin-top: 0;
  }

  .a0-agent-calendar-section h3 {
    margin: 0 0 0.6rem;
    font-size: 0.95rem;
  }

  .a0-agent-calendar-list {
    display: grid;
    gap: 0.45rem;
  }

  .a0-agent-calendar-list.a0-agent-calendar-files-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: start;
  }

  .a0-agent-calendar-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 0.8rem;
    align-items: center;
    padding: 0.65rem 0.75rem;
    border: 1px solid var(--border-color, rgba(255,255,255,0.1));
    border-radius: 0.55rem;
    background: color-mix(in srgb, currentColor 4%, transparent);
  }

  .a0-agent-calendar-row-main {
    min-width: 0;
  }

  .a0-agent-calendar-row-name {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    font-weight: 600;
    overflow-wrap: anywhere;
  }

  .a0-agent-calendar-row-meta {
    margin-top: 0.2rem;
    opacity: 0.68;
    font-size: 0.78rem;
    overflow-wrap: anywhere;
  }

  .a0-agent-calendar-actions {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    flex-wrap: wrap;
  }

  .a0-agent-calendar-input-row {
    display: grid;
    grid-template-columns: minmax(120px, 0.75fr) minmax(180px, 1.25fr) auto;
    gap: 0.5rem;
    margin-top: 0.6rem;
  }

  .a0-agent-calendar-input-row input,
  .a0-agent-calendar-editor input,
  .a0-agent-calendar-editor textarea {
    min-width: 0;
    padding: 0.48rem 0.55rem;
    border: 1px solid var(--border-color, rgba(255,255,255,0.16));
    border-radius: 0.42rem;
    background: var(--background-secondary, rgba(255,255,255,0.04));
    color: inherit;
    font: inherit;
  }

  .a0-agent-calendar-editor {
    grid-column: 1 / -1;
    border-top: 1px solid var(--border-color, rgba(255,255,255,0.12));
    padding-top: 0.85rem;
  }

  .a0-agent-calendar-editor-toolbar {
    display: flex;
    gap: 0.45rem;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.65rem;
  }

  .a0-agent-calendar-editor-title {
    min-width: 0;
    font-weight: 700;
    overflow-wrap: anywhere;
  }

  .a0-agent-calendar-editor-grid {
    display: grid;
    grid-template-columns: minmax(260px, 0.9fr) minmax(320px, 1.1fr);
    gap: 0.8rem;
    align-items: start;
  }

  .a0-agent-calendar-event-list {
    max-height: 230px;
    overflow: auto;
    display: grid;
    gap: 0.4rem;
  }

  .a0-agent-calendar-event-row {
    text-align: left;
    width: 100%;
    border: 1px solid var(--border-color, rgba(255,255,255,0.12));
    border-radius: 0.5rem;
    padding: 0.55rem 0.65rem;
    background: color-mix(in srgb, currentColor 4%, transparent);
    color: inherit;
    cursor: pointer;
  }

  .a0-agent-calendar-event-row:hover,
  .a0-agent-calendar-event-row.a0-agent-calendar-event-row-active {
    background: color-mix(in srgb, currentColor 11%, transparent);
  }

  .a0-agent-calendar-event-title {
    font-weight: 650;
    overflow-wrap: anywhere;
  }

  .a0-agent-calendar-event-meta {
    margin-top: 0.18rem;
    opacity: 0.68;
    font-size: 0.78rem;
  }

  .a0-agent-calendar-form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.5rem;
  }

  .a0-agent-calendar-form-field {
    display: grid;
    gap: 0.24rem;
    font-size: 0.82rem;
  }

  .a0-agent-calendar-form-field-full {
    grid-column: 1 / -1;
  }

  .a0-agent-calendar-form-field label {
    opacity: 0.78;
  }

  .a0-agent-calendar-form-check {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    min-height: 2.25rem;
  }

  .a0-agent-calendar-form-actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 0.45rem;
    justify-content: flex-end;
    flex-wrap: wrap;
    margin-top: 0.15rem;
  }

  .a0-agent-calendar-editor-type {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0.25rem 0 0.6rem 0;
  }

  .a0-agent-calendar-editor-type-label {
    font-size: 0.78rem;
    opacity: 0.75;
  }

  .a0-agent-calendar-content-grid .a0-agent-calendar-input-row {
    grid-template-columns: minmax(100px, 0.8fr) minmax(160px, 1.2fr) auto;
  }

  .a0-agent-calendar-small-button {
    padding: 0.45rem 0.65rem;
    border: 1px solid var(--border-color, rgba(255,255,255,0.16));
    border-radius: 0.45rem;
    background: color-mix(in srgb, currentColor 7%, transparent);
    color: inherit;
    cursor: pointer;
  }
  .a0-agent-calendar-small-button:hover {
    background: color-mix(in srgb, currentColor 13%, transparent);
  }

  .a0-agent-calendar-error {
    margin: 0.75rem 0;
    padding: 0.65rem 0.75rem;
    border-radius: 0.5rem;
    background: rgba(210, 64, 64, 0.18);
    color: #ffb7b7;
  }

  .a0-agent-calendar-slide-enter-active,
  .a0-agent-calendar-slide-leave-active {
    transition: transform 180ms ease, opacity 180ms ease;
  }

  .a0-agent-calendar-slide-enter-from,
  .a0-agent-calendar-slide-leave-to {
    opacity: 0;
    transform: translateY(1.25rem);
  }

  .a0-agent-calendar-slide-enter-to,
  .a0-agent-calendar-slide-leave-from {
    opacity: 1;
    transform: translateY(0);
  }

  @media (max-width: 920px) {
    .a0-agent-calendar-tab-anchor {
      --a0-calendar-panel-margin: 0.5rem;
    }
  }

  @media (max-width: 860px) {
    .a0-agent-calendar-content-grid,
    .a0-agent-calendar-list.a0-agent-calendar-files-list,
    .a0-agent-calendar-editor-grid,
    .a0-agent-calendar-form-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 680px) {
    .a0-agent-calendar-input-row {
      grid-template-columns: 1fr;
    }

    .a0-agent-calendar-row {
      grid-template-columns: 1fr;
    }
  }
</style>

<span class="a0-agent-calendar-tab-anchor" x-data x-effect="$store.agentCalendar?.onContextChanged($store.chats?.selected || '')" @keydown.escape.window="$store.agentCalendar?.closeCalendar()">
<button
  type="button"
  class="text-button"
  :class="$store.agentCalendar?.visible ? 'a0-agent-calendar-toggle-open' : ''"
  title="Calendar"
  @click.prevent.stop="$store.agentCalendar.toggleCalendar()"
>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
    <line x1="16" y1="2" x2="16" y2="6"></line>
    <line x1="8" y1="2" x2="8" y2="6"></line>
    <line x1="3" y1="10" x2="21" y2="10"></line>
    <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"></path>
  </svg>
  <p>Calendar</p>
</button>

<div
  x-cloak
  x-show="$store.agentCalendar && $store.agentCalendar.visible"
  x-transition:enter="a0-agent-calendar-slide-enter-active"
  x-transition:enter-start="a0-agent-calendar-slide-enter-from"
  x-transition:enter-end="a0-agent-calendar-slide-enter-to"
  x-transition:leave="a0-agent-calendar-slide-leave-active"
  x-transition:leave-start="a0-agent-calendar-slide-leave-from"
  x-transition:leave-end="a0-agent-calendar-slide-leave-to"
  class="a0-agent-calendar-panel"
  role="dialog"
  aria-label="Agent Calendar"
  @click.stop
>
    <div class="a0-agent-calendar-body">
      <template x-if="$store.agentCalendar.loading">
        <div class="a0-agent-calendar-muted">Loading calendar stack…</div>
      </template>

      <template x-if="$store.agentCalendar.error">
        <div class="a0-agent-calendar-error" x-text="$store.agentCalendar.error"></div>
      </template>

      <template x-if="!$store.agentCalendar.loading">
        <div class="a0-agent-calendar-content-grid">
          <div class="a0-agent-calendar-section">
            <div class="a0-agent-calendar-section-title-row">
              <h3 class="a0-agent-calendar-section-header">
                <span x-text="$store.agentCalendar.agentDisplayName()"></span>
                <span> ICS Files </span>
                <span class="a0-agent-calendar-heading-context" x-show="$store.agentCalendar.ctxid" x-text="`(${$store.agentCalendar.ctxid})`"></span>
              </h3>
              <div class="a0-agent-calendar-actions a0-agent-calendar-files-actions">
                <button type="button" class="a0-agent-calendar-small-button" @click="$store.agentCalendar.createLocalCalendar()">
                  <i class="ti ti-file-plus" aria-hidden="true"></i>
                  New ICS
                </button>
                <button type="button" class="a0-agent-calendar-small-button" @click="$store.agentCalendar.refresh()">
                  <i class="ti ti-refresh" aria-hidden="true"></i>
                  Refresh
                </button>
              </div>
            </div>

            <template x-if="$store.agentCalendar.files.length === 0">
              <div class="a0-agent-calendar-muted a0-agent-calendar-files-list">No local .ics files yet.</div>
            </template>

            <div class="a0-agent-calendar-list a0-agent-calendar-files-list">
              <template x-for="file in $store.agentCalendar.files" :key="file.relative_path">
                <div class="a0-agent-calendar-row">
                  <div class="a0-agent-calendar-row-main">
                    <div class="a0-agent-calendar-row-name">
                      <i class="ti ti-file-type-ics" aria-hidden="true"></i>
                      <span x-text="file.name"></span>
                    </div>
                    <div class="a0-agent-calendar-row-meta">
                      <span x-show="file.component_kind === 'event'">📅 </span>
                      <span x-show="file.component_kind === 'todo'">☑ </span>
                      <span x-text="(file.summary || file.event_summary || file.todo_summary) || '(empty)'"></span>
                      <template x-if="file.is_recurring">
                        <span> · Repeats</span>
                      </template>
                    </div>
                  </div>
                  <div class="a0-agent-calendar-actions">
                    <button type="button" class="a0-agent-calendar-small-button" @click="$store.agentCalendar.openIcsFile(file)">
                      Edit
                    </button>
                    <button type="button" class="a0-agent-calendar-small-button" @click="$store.agentCalendar.deleteLocalCalendar(file)">
                      Delete
                    </button>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <div class="a0-agent-calendar-section">
            <h3 class="a0-agent-calendar-section-header">CalDAV Account</h3>

            <template x-if="!$store.agentCalendar.caldavAccount">
              <div class="a0-agent-calendar-muted">No CalDAV account configured for this Agent.</div>
            </template>

            <template x-if="$store.agentCalendar.caldavAccount">
              <div class="a0-agent-calendar-list">
                <div class="a0-agent-calendar-row">
                  <div class="a0-agent-calendar-row-main">
                    <div class="a0-agent-calendar-row-name">
                      <i class="ti ti-server" aria-hidden="true"></i>
                      <span x-text="$store.agentCalendar.caldavAccount.label || $store.agentCalendar.caldavAccount.server_url"></span>
                      <span class="a0-agent-calendar-row-status"
                            x-show="$store.agentCalendar.caldavAccount.status"
                            x-text="$store.agentCalendar.caldavAccount.status === 'ok' ? '✓' : ($store.agentCalendar.caldavAccount.status === 'error' ? '⚠' : '?')"
                            :title="$store.agentCalendar.caldavAccount.last_error || $store.agentCalendar.caldavAccount.status"></span>
                    </div>
                    <div class="a0-agent-calendar-row-meta">
                      <div>
                        <strong>CalDAV server:</strong>
                        <span x-text="($store.agentCalendar.caldavAccount.username ? $store.agentCalendar.caldavAccount.username + '@' : '') + $store.agentCalendar.caldavAccount.server_url"></span>
                      </div>
                      <template x-if="$store.agentCalendar.caldavAccount.webui_calendar_url">
                        <div>
                          <strong>Calendar Web URL:</strong>
                          <a :href="$store.agentCalendar.caldavAccount.webui_calendar_url"
                             target="_blank"
                             rel="noopener noreferrer"
                             x-text="$store.agentCalendar.caldavAccount.webui_calendar_url"></a>
                        </div>
                      </template>
                      <template x-if="$store.agentCalendar.caldavAccount.selected_collection_name">
                        <div>
                          <strong>Selected collection:</strong>
                          <span x-text="$store.agentCalendar.caldavAccount.selected_collection_name"></span>
                        </div>
                      </template>
                      <template x-if="$store.agentCalendar.caldavAccount.last_error">
                        <div class="a0-agent-calendar-row-error" x-text="$store.agentCalendar.caldavAccount.last_error"></div>
                      </template>
                    </div>
                    <template x-if="Array.isArray($store.agentCalendar.caldavAccount.collections) && $store.agentCalendar.caldavAccount.collections.length > 0">
                      <div class="a0-agent-calendar-input-row">
                        <select class="a0-agent-calendar-small-button"
                                @change="$store.agentCalendar.selectCaldavCollection($event.target.value)">
                          <option value="" :selected="!$store.agentCalendar.caldavAccount.selected_collection_url">Select collection…</option>
                          <template x-for="col in $store.agentCalendar.caldavAccount.collections" :key="col.url">
                            <option :value="col.url"
                                    :selected="col.url === $store.agentCalendar.caldavAccount.selected_collection_url"
                                    x-text="col.display_name || col.name || col.url"></option>
                          </template>
                        </select>
                      </div>
                    </template>
                  </div>
                  <div class="a0-agent-calendar-actions">
                    <button type="button" class="a0-agent-calendar-small-button" @click="$store.agentCalendar.testCaldavAccount()">
                      Test
                    </button>
                    <template x-if="$store.agentCalendar.caldavAccount.webui_calendar_url">
                      <a class="a0-agent-calendar-small-button"
                         :href="$store.agentCalendar.caldavAccount.webui_calendar_url"
                         target="_blank"
                         rel="noopener noreferrer">
                        Open Calendar
                      </a>
                    </template>
                    <template x-if="$store.agentCalendar.caldavAccount.selected_collection_url">
                      <button type="button" class="a0-agent-calendar-small-button" @click="$store.agentCalendar.openCaldavCollection()">
                        Open Collection
                      </button>
                    </template>
                    <button type="button" class="a0-agent-calendar-small-button" @click="$store.agentCalendar.beginEditCaldavAccount()">
                      Edit/Reconfigure
                    </button>
                    <button type="button" class="a0-agent-calendar-small-button" @click="$store.agentCalendar.removeCaldavAccount()">
                      Remove
                    </button>
                  </div>
                </div>
              </div>
            </template>

            <template x-if="!$store.agentCalendar.caldavAccount || $store.agentCalendar.editingCaldavAccount">
              <div class="a0-agent-calendar-input-row a0-agent-calendar-caldav-form">
                <input type="text" placeholder="Label (optional)" x-model="$store.agentCalendar.newCaldav.label">
                <input type="url" placeholder="CalDAV server URL, e.g. https://caldav.example.com" x-model="$store.agentCalendar.newCaldav.server_url">
                <input type="url" placeholder="WebUI Calendar URL (optional)" x-model="$store.agentCalendar.newCaldav.webui_calendar_url">
                <input type="text" placeholder="Username" autocomplete="username" x-model="$store.agentCalendar.newCaldav.username">
                <input type="password" placeholder="Password / App password" autocomplete="new-password" x-model="$store.agentCalendar.newCaldav.password" @keydown.enter="$store.agentCalendar.addCaldavAccount()">
                <button type="button" class="a0-agent-calendar-small-button" @click="$store.agentCalendar.addCaldavAccount()">
                  <span x-text="$store.agentCalendar.caldavAccount ? 'Save CalDAV account' : 'Add CalDAV account'"></span>
                </button>
                <template x-if="$store.agentCalendar.caldavAccount">
                  <button type="button" class="a0-agent-calendar-small-button" @click="$store.agentCalendar.cancelEditCaldavAccount()">
                    Cancel
                  </button>
                </template>
              </div>
            </template>

            <template x-if="$store.agentCalendar.selectedCaldavAccountId">
              <div class="a0-agent-calendar-caldav-events">
                <h4 class="a0-agent-calendar-section-subheader">
                  Events
                  <span class="a0-agent-calendar-heading-context"
                        x-show="$store.agentCalendar.selectedCaldavCollectionLabel"
                        x-text="`(${$store.agentCalendar.selectedCaldavCollectionLabel})`"></span>
                  <button type="button" class="a0-agent-calendar-small-button" @click="$store.agentCalendar.refreshCaldavEvents()">
                    Refresh
                  </button>
                  <button type="button" class="a0-agent-calendar-small-button" @click="$store.agentCalendar.newCaldavEvent()">
                    New event
                  </button>
                </h4>
                <template x-if="$store.agentCalendar.caldavEvents.length === 0">
                  <div class="a0-agent-calendar-muted">No events found in the selected collection.</div>
                </template>
                <div class="a0-agent-calendar-list">
                  <template x-for="ev in $store.agentCalendar.caldavEvents" :key="ev.href || ev.uid">
                    <div class="a0-agent-calendar-row">
                      <div class="a0-agent-calendar-row-main">
                        <div class="a0-agent-calendar-row-name">
                          <span x-show="ev.component_kind === 'todo'">☑ </span>
                          <span x-show="ev.component_kind !== 'todo'">📅 </span>
                          <span x-text="ev.summary || '(untitled)'"></span>
                        </div>
                        <div class="a0-agent-calendar-row-meta">
                          <span x-text="ev.dtstart || ''"></span>
                          <template x-if="ev.dtend">
                            <span> → <span x-text="ev.dtend"></span></span>
                          </template>
                          <template x-if="ev.is_recurring">
                            <span> · Repeats</span>
                          </template>
                        </div>
                      </div>
                      <div class="a0-agent-calendar-actions">
                        <button type="button" class="a0-agent-calendar-small-button" @click="$store.agentCalendar.openCaldavEvent(ev)">
                          Edit
                        </button>
                        <button type="button" class="a0-agent-calendar-small-button" @click="$store.agentCalendar.deleteCaldavEvent(ev)">
                          Delete
                        </button>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>

          <template x-if="$store.agentCalendar.selectedFileName">
            <div class="a0-agent-calendar-section a0-agent-calendar-editor">
              <div class="a0-agent-calendar-editor-toolbar">
                <div class="a0-agent-calendar-editor-title">
                  Editing <span x-text="$store.agentCalendar.selectedFileName"></span>
                </div>
                <div class="a0-agent-calendar-actions">
                  <button type="button" class="a0-agent-calendar-small-button" @click="$store.agentCalendar.closeIcsFile()">Close</button>
                </div>
              </div>

              <div class="a0-agent-calendar-editor-type">
                <label class="a0-agent-calendar-editor-type-label" for="a0-agent-calendar-component-kind">Type</label>
                <select id="a0-agent-calendar-component-kind"
                        class="a0-agent-calendar-small-button"
                        x-model="$store.agentCalendar.componentKind"
                        @change="$store.agentCalendar.switchComponentKind()">

<script type="module">
  import { callJsonApi } from "/js/api.js";

  function selectedContextId() {
    try {
      const chats = window.Alpine?.store?.("chats");
      if (chats?.getSelectedChatId) return chats.getSelectedChatId() || "";
      if (chats?.selectedChatId) return chats.selectedChatId || "";
      if (chats?.selected) return chats.selected || "";
    } catch (_e) {}
    return "";
  }

  function selectedContextDisplayName() {
    try {
      const chats = window.Alpine?.store?.("chats");
      const selectedId = selectedContextId();
      const candidates = [];

      if (chats?.getSelectedChat) candidates.push(chats.getSelectedChat());
      if (chats?.selectedChat) candidates.push(chats.selectedChat);
      if (chats?.currentChat) candidates.push(chats.currentChat);
      if (chats?.activeChat) candidates.push(chats.activeChat);

      const collections = [chats?.chats, chats?.items, chats?.list, chats?.contexts];
      for (const collection of collections) {
        if (Array.isArray(collection)) {
          candidates.push(collection.find((chat) => {
            const id = chat?.id || chat?.ctxid || chat?.context_id || chat?.contextId;
            return selectedId && id === selectedId;
          }));
        } else if (collection && typeof collection === "object") {
          candidates.push(collection[selectedId]);
        }
      }

      for (const chat of candidates) {
        if (!chat || typeof chat !== "object") continue;
        for (const key of ["static_name", "staticName", "name", "title", "agent_name", "agentName", "label"]) {
          const value = chat[key];
          if (typeof value === "string" && value.trim() && value.trim() !== selectedId) return value.trim();
        }
      }
    } catch (_e) {}
    return "";
  }

  function registerAgentCalendarStore() {
    if (!window.Alpine) return;
    try {
      if (window.Alpine.store("agentCalendar")) return;
    } catch (_e) {}

    window.Alpine.store("agentCalendar", {
      visible: false,
      loading: false,
      error: "",
      ctxid: "",
      agentName: "",
      calendarDir: "",
      files: [],
      caldavAccount: null,
      caldavAccounts: [],
      caldavEvents: [],
      selectedCaldavAccountId: "",
      selectedCaldavCollectionLabel: "",
      selectedCaldavHref: "",
      selectedSource: "local",
      selectedFileName: "",
      selectedFile: null,
      selectedEvents: [],
      eventForm: {},
      todoForm: {},
      componentKind: "event",
      originalEventUid: "",
      originalTodoUid: "",
      newCaldav: { label: "", server_url: "", webui_calendar_url: "", username: "", password: "" },
      editingCaldavAccount: false,
      calendarTabWidth: "7rem",
      calendarHostEl: null,
      calendarOutputEl: null,
      calendarLiftEls: [],
      placementCleanupTimer: null,
      _ctxRefreshInflight: "",
      _ctxLastSeen: null,

      calendarAnchor() {
        return document.querySelector(".a0-agent-calendar-tab-anchor");
      },

      calendarButton() {
        return document.querySelector(".a0-agent-calendar-tab-anchor > .text-button");
      },

      calendarActionHost() {
        const anchor = this.calendarAnchor();
        if (!anchor) return null;

        // Calendar lives in the bottom action row. Keep that row anchored at the
        // bottom and use it only as the tab/panel anchor; do not lift it.
        return anchor.closest?.(".chat-bottom-actions-bar") ||
          anchor.closest?.(".text-buttons-row") ||
          anchor.parentElement ||
          anchor;
      },

      calendarComposerReferenceEl(host) {
        try {
          const input = document.getElementById("chat-input");
          const row = input?.closest?.(".input-row");
          if (row && !(host && (row === host || host.contains(row)))) return row;

          const container = input?.closest?.("#chat-input-container");
          if (container && !(host && (container === host || host.contains(container)))) return container;
          return input || null;
        } catch (_e) {
          return null;
        }
      },

      calendarComposerLiftTargets(host) {
        const targets = [];
        const add = (el) => {
          if (!el || targets.includes(el)) return;
          if (host && (el === host || host.contains(el))) return;
          if (el.closest?.(".chat-bottom-actions-bar") || el.classList?.contains("chat-bottom-actions-bar")) return;

          // Never transform both a node and a related ancestor/descendant.
          for (const existing of targets) {
            if (existing && existing.contains?.(el)) return;
          }
          for (let i = targets.length - 1; i >= 0; i -= 1) {
            const existing = targets[i];
            if (el.contains?.(existing)) targets.splice(i, 1);
          }

          targets.push(el);
        };

        try {
          const reference = this.calendarComposerReferenceEl(host);
          const progressBox = document.getElementById("progress-bar-box");

          // Keep this intentionally deterministic. Earlier versions also
          // scanned arbitrary #input-section children for attachment/queue
          // wrappers, but in real layouts that can select a second wrapper for
          // the same prompt area and make the prompt appear double-lifted.
          if (
            progressBox &&
            !(reference && (
              progressBox === reference ||
              progressBox.contains?.(reference) ||
              reference.contains?.(progressBox)
            ))
          ) {
            add(progressBox);
          }
          add(reference);
        } catch (_e) {}

        return targets;
      },

      liftComposerElements(host, lift) {
        try {
          const targets = this.calendarComposerLiftTargets(host);
          for (const previous of this.calendarLiftEls || []) {
            if (!targets.includes(previous)) {
              previous.classList.remove("a0-agent-calendar-compose-lifted");
              previous.style.removeProperty("--a0-calendar-panel-lift");
            }
          }

          this.calendarLiftEls = targets;
          for (const el of targets) {
            el.style.setProperty("--a0-calendar-panel-lift", `${lift}px`);
            el.classList.add("a0-agent-calendar-compose-lifted");
          }
        } catch (_e) {}
      },

      clearComposerLift() {
        try {
          for (const el of this.calendarLiftEls || []) {
            el.classList.remove("a0-agent-calendar-compose-lifted");
            el.style.removeProperty("--a0-calendar-panel-lift");
          }
          this.calendarLiftEls = [];
        } catch (_e) {}
      },

      calendarOutputHost(host) {
        try {
          // The WebUI's actual monologue/message viewport is #chat-history.
          // Prefer it explicitly so we do not accidentally pad a generic wrapper
          // while the real scroll pane remains hidden behind the model/status strip.
          const history = document.getElementById("chat-history");
          if (history) return history;

          const hostRect = host?.getBoundingClientRect?.();
          if (!hostRect) return null;

          const candidates = Array.from(document.querySelectorAll(
            '[data-role="messages"], .messages, .message-list, .chat-messages, .monologue, main, section'
          ));
          let best = null;
          let bestScore = -Infinity;

          for (const el of candidates) {
            if (!el || el === host || host.contains(el) || el.contains(host)) continue;
            const rect = el.getBoundingClientRect();
            if (rect.width < 260 || rect.height < 160) continue;
            if (rect.bottom > hostRect.top + 24) continue;
            if (rect.right < hostRect.left + 80 || rect.left > hostRect.right - 80) continue;

            const style = window.getComputedStyle(el);
            const canScroll = /(auto|scroll)/.test(`${style.overflowY} ${style.overflow}`) || el.scrollHeight > el.clientHeight + 24;
            const verticalCloseness = Math.max(0, 420 - Math.abs(hostRect.top - rect.bottom));
            const widthOverlap = Math.min(rect.right, hostRect.right) - Math.max(rect.left, hostRect.left);
            const score = (canScroll ? 1000 : 0) + verticalCloseness + Math.max(0, widthOverlap) - Math.abs(rect.width - hostRect.width) * 0.15;

            if (score > bestScore) {
              bestScore = score;
              best = el;
            }
          }

          return best;
        } catch (_e) {
          return null;
        }
      },

      calendarLowerChromeTop(host) {
        try {
          const hostRect = host?.getBoundingClientRect?.();
          const inputSection = document.getElementById("input-section");
          const progressBox = document.getElementById("progress-bar-box");
          const candidates = [progressBox, inputSection, host].filter(Boolean);
          let top = Number.POSITIVE_INFINITY;

          for (const el of candidates) {
            const rect = el.getBoundingClientRect();
            if (!rect || rect.height <= 0) continue;
            if (rect.bottom < 0) continue;
            top = Math.min(top, rect.top);
          }

          if (Number.isFinite(top)) return Math.round(top);
          return Math.round(hostRect?.top || 0);
        } catch (_e) {
          return 0;
        }
      },

      liftOutputHost(host, lift) {
        try {
          const output = this.calendarOutputHost(host);
          if (this.calendarOutputEl && this.calendarOutputEl !== output) this.clearOutputLift();
          if (!output) return;

          this.calendarOutputEl = output;
          output.classList.add("a0-agent-calendar-output-lifted");
          if (!output.dataset.a0CalendarHasOriginals) {
            const computed = window.getComputedStyle(output);
            output.dataset.a0CalendarHasOriginals = "1";
            output.dataset.a0CalendarOriginalHeight = output.style.height || "";
            output.dataset.a0CalendarOriginalMaxHeight = output.style.maxHeight || "";
            output.dataset.a0CalendarOriginalPaddingBottom = output.style.paddingBottom || "";
            output.dataset.a0CalendarOriginalMarginBottom = output.style.marginBottom || "";
            output.dataset.a0CalendarBasePaddingBottom = String(Number.parseFloat(computed.paddingBottom) || 0);
            output.dataset.a0CalendarBaseHeight = String(output.getBoundingClientRect().height || output.clientHeight || 0);
          }

          const rect = output.getBoundingClientRect();
          const lowerTop = this.calendarLowerChromeTop(host);
          const gap = 2;

          // `liftComposerElements()` runs before this method, so lowerTop is
          // already the visual top of the lifted prompt/model chrome. Do not
          // subtract `lift` again here; doing so shrinks/slides #chat-history by
          // the lift twice and makes the monologue jump too high.
          const desiredBottom = Math.max(0, lowerTop - gap);
          const targetHeightFromGeometry = Math.max(140, Math.round(desiredBottom - rect.top));
          const baseHeight = Number.parseFloat(output.dataset.a0CalendarBaseHeight || "0") || rect.height || output.clientHeight || targetHeightFromGeometry;
          const targetHeight = Math.min(Math.round(baseHeight), targetHeightFromGeometry);
          const basePadding = Number.parseFloat(output.dataset.a0CalendarBasePaddingBottom || "0") || 0;

          // Shrink the actual scroll viewport so its bottom edge sits above the
          // visually lifted Agent/model strip. Padding alone leaves the viewport
          // behind that strip, which is what caused the monologue to be obscured.
          output.style.height = `${targetHeight}px`;
          output.style.maxHeight = `${targetHeight}px`;
          output.style.paddingBottom = `${Math.round(basePadding + Math.max(0, lift * 0.25))}px`;
          output.style.marginBottom = "0px";
          if (typeof output.scrollTop === "number") output.scrollTop = output.scrollTop;
        } catch (_e) {}
      },

      clearOutputLift() {
        try {
          if (!this.calendarOutputEl) return;
          const output = this.calendarOutputEl;
          output.classList.remove("a0-agent-calendar-output-lifted");
          output.style.height = output.dataset.a0CalendarOriginalHeight || "";
          output.style.maxHeight = output.dataset.a0CalendarOriginalMaxHeight || "";
          output.style.paddingBottom = output.dataset.a0CalendarOriginalPaddingBottom || "";
          output.style.marginBottom = output.dataset.a0CalendarOriginalMarginBottom || "";
          delete output.dataset.a0CalendarHasOriginals;
          delete output.dataset.a0CalendarOriginalHeight;
          delete output.dataset.a0CalendarOriginalMaxHeight;
          delete output.dataset.a0CalendarOriginalPaddingBottom;
          delete output.dataset.a0CalendarOriginalMarginBottom;
          delete output.dataset.a0CalendarBasePaddingBottom;
          delete output.dataset.a0CalendarBaseHeight;
          this.calendarOutputEl = null;
        } catch (_e) {}
      },

      syncPanelPlacement() {
        try {
          if (this.placementCleanupTimer) {
            window.clearTimeout(this.placementCleanupTimer);
            this.placementCleanupTimer = null;
          }

          const anchor = this.calendarAnchor();
          const button = this.calendarButton();
          const host = this.calendarActionHost();
          if (!anchor || !button || !host) return;

          if (this.calendarHostEl && this.calendarHostEl !== host) {
            this.calendarHostEl.classList.remove("a0-agent-calendar-host-lifted");
            this.calendarHostEl.style.removeProperty("--a0-calendar-panel-lift");
          }
          this.calendarHostEl = host;

          const hostRect = host.getBoundingClientRect();
          const buttonRect = button.getBoundingClientRect();
          const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 800;
          const marginValue = getComputedStyle(anchor).getPropertyValue("--a0-calendar-panel-margin").trim();
          const margin = Number.parseFloat(marginValue) || 8;

          const anchorRect = anchor.getBoundingClientRect();
          const reference = this.calendarComposerReferenceEl(host);
          const referenceRect = reference?.getBoundingClientRect?.();
          const activeReferenceLift = reference
            ? (Number.parseFloat(reference.style.getPropertyValue("--a0-calendar-panel-lift")) ||
              Number.parseFloat(getComputedStyle(reference).getPropertyValue("--a0-calendar-panel-lift")) ||
              0)
            : 0;
          const panelBottom = Math.round(anchorRect.top || buttonRect.top || hostRect.top);
          const referenceUnliftedBottom = referenceRect
            ? Math.round(referenceRect.bottom + activeReferenceLift)
            : null;
          const originalComposerGap = referenceUnliftedBottom !== null
            ? Math.max(0, Math.round(panelBottom - referenceUnliftedBottom))
            : 0;
          const desiredComposerGap = Math.max(2, Math.round(margin * 0.35));
          const editorOpen = Boolean(this.selectedFileName);
          const baseHeight = editorOpen
            ? Math.round(Math.min(560, Math.max(360, viewportHeight * 0.58)))
            : Math.round(Math.min(220, Math.max(140, viewportHeight * 0.18)));
          const desiredHeight = Math.max(baseHeight, originalComposerGap + desiredComposerGap);

          // The panel is anchored to the bottom action row and opens upward.
          // If we lift the composer by the full panel height, the old distance
          // between composer and action row remains as a visible gap. Subtract
          // that original gap so the lifted composer lands just above the panel.
          const lift = Math.max(0, Math.round(desiredHeight - originalComposerGap + desiredComposerGap));
          const panelWidth = Math.max(280, Math.min(hostRect.width, window.innerWidth - (margin * 2)));
          const offsetLeft = Math.max(0, Math.round(buttonRect.left - hostRect.left));

          anchor.style.setProperty("--a0-calendar-panel-width", `${Math.round(panelWidth)}px`);
          anchor.style.setProperty("--a0-calendar-panel-height", `${desiredHeight}px`);
          anchor.style.setProperty("--a0-calendar-panel-max-height", `${desiredHeight}px`);
          anchor.style.setProperty("--a0-calendar-tab-offset-left", `${offsetLeft}px`);
          anchor.style.setProperty("--a0-calendar-tab-width", `${Math.ceil(buttonRect.width)}px`);
          anchor.style.setProperty("--a0-calendar-tab-left", `${offsetLeft}px`);

          host.classList.add("a0-agent-calendar-host-lifted");
          this.liftComposerElements(host, lift);
          this.liftOutputHost(host, lift);
        } catch (_e) {}
      },

      clearPanelPlacement() {
        try {
          const anchor = this.calendarAnchor();
          if (this.calendarHostEl) {
            this.calendarHostEl.classList.remove("a0-agent-calendar-host-lifted");
            this.calendarHostEl.style.removeProperty("--a0-calendar-panel-lift");
            this.calendarHostEl = null;
          }
          if (anchor) {
            anchor.style.removeProperty("--a0-calendar-panel-width");
            anchor.style.removeProperty("--a0-calendar-panel-height");
            anchor.style.removeProperty("--a0-calendar-panel-max-height");
            anchor.style.removeProperty("--a0-calendar-tab-offset-left");
            anchor.style.removeProperty("--a0-calendar-tab-width");
            anchor.style.removeProperty("--a0-calendar-tab-left");
          }
          this.clearComposerLift();
          this.clearOutputLift();
        } catch (_e) {}
      },

      syncTabWidth() {
        this.syncPanelPlacement();
      },

      async onContextChanged(nextCtxid) {
        const next = String(nextCtxid || "").trim();
        // First call: prime tracking without re-running side effects on initial mount.
        if (this._ctxLastSeen === null) {
          this._ctxLastSeen = next;
          if (!this.ctxid && next) this.ctxid = next;
          return;
        }
        if (next === this._ctxLastSeen) return;
        this._ctxLastSeen = next;

        // Inflight guard: if we are already refreshing for this ctxid, skip.
        if (this._ctxRefreshInflight && this._ctxRefreshInflight === next) return;

        // Reset per-agent state since the focused agent changed.
        this.ctxid = next;
        this.agentName = "";
        this.error = "";
        this.files = [];
        this.caldavAccount = null;
        this.caldavAccounts = [];
        this.caldavEvents = [];
        this.selectedCaldavAccountId = "";
        this.selectedCaldavCollectionLabel = "";
        this.selectedCaldavHref = "";
        this.selectedSource = "local";
        this.closeIcsFile();

        if (!next) return;

        // Pull a friendly name eagerly; refresh() will also re-derive from API.
        const selectedName = selectedContextDisplayName();
        if (selectedName && selectedName !== next) this.agentName = selectedName;

        // Only re-fetch immediately when the panel is open; otherwise the next
        // openCalendar() call will fetch fresh data for the new agent.
        if (!this.visible) return;

        this._ctxRefreshInflight = next;
        try {
          await this.refresh();
        } finally {
          if (this._ctxRefreshInflight === next) this._ctxRefreshInflight = "";
        }
      },

      agentDisplayName() {
        const name = String(this.agentName || "").trim();
        const ctxid = String(this.ctxid || "").trim();
        return name && name !== ctxid ? name : "Agent";
      },

      todayIsoDate() {
        return new Date().toISOString().slice(0, 10);
      },

      defaultEventForm() {
        const today = this.todayIsoDate();
        return {
          uid: "",
          summary: "",
          description: "",
          location: "",
          start_date: today,
          start_time: "09:00",
          end_date: today,
          end_time: "10:00",
          all_day: false,
          recurrence_frequency: "none",
          recurrence_interval: "1",
          recurrence_count: "",
          recurrence_until: "",
          rrule: "",
          rdate: "",
          exdate: "",
        };
      },

      normalizeEventForm(event = {}) {
        const today = this.todayIsoDate();
        return {
          uid: String(event.uid || ""),
          summary: String(event.summary || ""),
          description: String(event.description || ""),
          location: String(event.location || ""),
          start_date: String(event.start_date || today),
          start_time: String(event.start_time || "09:00").slice(0, 5),
          end_date: String(event.end_date || event.start_date || today),
          end_time: String(event.end_time || event.start_time || "10:00").slice(0, 5),
          all_day: Boolean(event.all_day),
          recurrence_frequency: String(event.recurrence_frequency || (event.is_recurring ? "custom" : "none") || "none"),
          recurrence_interval: String(event.recurrence_interval || "1"),
          recurrence_count: String(event.recurrence_count || ""),
          recurrence_until: String(event.recurrence_until || ""),
          rrule: String(event.rrule || ""),
          rdate: String(event.rdate || ""),

        };

      defaultTodoForm() {
        const today = this.todayIsoDate();
        return {
          uid: "",
          summary: "",
          description: "",
          location: "",
          start_date: "",
          start_time: "09:00",
          due_date: today,

          recurrence_frequency: "none",

        };
      },

      normalizeTodoForm(todo = {}) {
        const today = this.todayIsoDate();
        return {
          uid: String(todo.uid || ""),
          summary: String(todo.summary || ""),
          description: String(todo.description || ""),
          location: String(todo.location || ""),
          start_date: String(todo.start_date || ""),

          recurrence_frequency: String(todo.recurrence_frequency || "none"),

          recurrence_count: String(todo.recurrence_count || ""),
          recurrence_until: String(todo.recurrence_until || ""),
          rrule: String(todo.rrule || ""),
          rdate: String(todo.rdate || ""),
          exdate: String(todo.exdate || ""),
        };
      },

      switchComponentKind() {
        // No persistence side effect: simply reset the inactive form so the
        // user can fill the freshly-selected component type from scratch.  The
        // backend rewrites the file on save based on the chosen action.
        if (this.componentKind === "event") {
          if (!this.eventForm || !Object.keys(this.eventForm).length) {
            this.eventForm = this.defaultEventForm();
          }
        } else if (this.componentKind === "todo") {
          if (!this.todoForm || !Object.keys(this.todoForm).length) {
            this.todoForm = this.defaultTodoForm();
          }
        }
      },

      buildSimpleRRule() {
        const form = this.eventForm || {};
        const frequency = String(form.recurrence_frequency || "none").toLowerCase();
        const freqMap = { minutely: "MINUTELY", hourly: "HOURLY", daily: "DAILY", weekly: "WEEKLY", monthly: "MONTHLY", yearly: "YEARLY" };
        if (!freqMap[frequency]) return "";
        const parts = [`FREQ=${freqMap[frequency]}`];
        const interval = Number.parseInt(String(form.recurrence_interval || "1"), 10);
        if (Number.isFinite(interval) && interval > 1) parts.push(`INTERVAL=${interval}`);
        const count = Number.parseInt(String(form.recurrence_count || ""), 10);
        if (Number.isFinite(count) && count > 0) {
          parts.push(`COUNT=${count}`);
        } else {
          const until = String(form.recurrence_until || "").trim();
          if (/^\d{4}-\d{2}-\d{2}$/.test(until)) parts.push(`UNTIL=${until.replaceAll("-", "")}T235959Z`);
        }
        return parts.join(";");
      },

      syncRecurrenceRule() {
        if (!this.eventForm) return;
        const frequency = String(this.eventForm.recurrence_frequency || "none").toLowerCase();
        if (frequency === "none") {
          this.eventForm.rrule = "";
          this.eventForm.rdate = "";
          this.eventForm.exdate = "";
          return;
        }
        if (frequency !== "custom") this.eventForm.rrule = this.buildSimpleRRule();
      },

      applyFileResult(result) {
        if (!result || result.ok === false) {
          this.error = result?.error || "Calendar file API returned an error.";
          return;
        }
        this.selectedFile = result.file || this.selectedFile;
        this.selectedFileName = this.selectedFile?.name || this.selectedFileName;
        const events = Array.isArray(result.events) ? result.events : [];
        const todos = Array.isArray(result.todos) ? result.todos : [];
        this.selectedEvents = events;
        const singleEvent = result.event || events[0] || null;
        const singleTodo = result.todo || todos[0] || null;
        const fileKind = String(result.component_kind || result.file?.component_kind || "").toLowerCase();

        if (singleEvent) {
          this.eventForm = this.normalizeEventForm(singleEvent);
          this.originalEventUid = String(singleEvent.uid || "");
        } else {
          this.eventForm = this.defaultEventForm();
          this.originalEventUid = "";
        }
        if (singleTodo) {
          this.todoForm = this.normalizeTodoForm(singleTodo);
          this.originalTodoUid = String(singleTodo.uid || "");
        } else {
          this.todoForm = this.defaultTodoForm();
          this.originalTodoUid = "";
        }

        if (fileKind === "event") this.componentKind = "event";
        else if (fileKind === "todo") this.componentKind = "todo";
        // empty file: keep current selection

        this.notifyCalendarIndicatorChanged(result);
        this.error = "";
        if (this.visible) window.requestAnimationFrame(() => this.syncPanelPlacement());
      },

      closeIcsFile() {
        this.selectedFileName = "";
        this.selectedFile = null;
        this.selectedEvents = [];
        this.eventForm = {};
        this.originalEventUid = "";
        if (this.visible) window.requestAnimationFrame(() => this.syncPanelPlacement());
      },

      newEvent() {
        this.eventForm = this.defaultEventForm();
        this.originalEventUid = "";
      },

      editEvent(event) {
        this.eventForm = this.normalizeEventForm(event);
        this.originalEventUid = String(event?.uid || "");
      },

      async toggleCalendar() {
        if (this.visible) {
          this.closeCalendar();
          return;
        }
        await this.openCalendar();
      },
      async openCalendar() {
        this.visible = true;
        const nextCtxid = selectedContextId();
        if (nextCtxid !== this.ctxid) this.agentName = "";
        this.ctxid = nextCtxid;
        const selectedName = selectedContextDisplayName();
        if (selectedName && selectedName !== this.ctxid) this.agentName = selectedName;
        window.requestAnimationFrame(() => this.syncPanelPlacement());
        await this.refresh();
        window.requestAnimationFrame(() => this.syncPanelPlacement());
      },

      closeCalendar() {
        this.visible = false;
        if (this.placementCleanupTimer) window.clearTimeout(this.placementCleanupTimer);
        this.placementCleanupTimer = window.setTimeout(() => this.clearPanelPlacement(), 220);
      },

      async refresh() {
        this.error = "";
        this.ctxid = this.ctxid || selectedContextId();
        if (!this.ctxid) {
          this.error = "No active context is selected.";
          return;
        }
        this.loading = true;
        try {
          const result = await callJsonApi("plugins/a0_superordinates/agent_calendar", {
            action: "list",
            ctxid: this.ctxid,
          });
          this.applyResult(result);
        } catch (error) {
          console.error("[Agent Calendar] Failed to load calendar stack", error);
          this.error = String(error?.message || error || "Failed to load calendar stack");
        } finally {
          this.loading = false;
        }
      },

      notifyCalendarIndicatorChanged(result) {
        if (!result || result.has_calendar === undefined) return;
        try {
          Alpine.store("superordinates")?.fetchMap?.();
        } catch (_error) {
          // Non-critical; the sidebar also refreshes periodically.
        }
      },

      applyResult(result) {
        if (!result || result.ok === false) {
          this.error = result?.error || "Calendar API returned an error.";
          return;
        }
        this.ctxid = result.ctxid || this.ctxid;
        const resultAgentName = String(result.agent_name || "").trim();
        if (resultAgentName && resultAgentName !== this.ctxid) this.agentName = resultAgentName;
        this.calendarDir = result.calendar_dir || "";
        this.files = Array.isArray(result.files) ? result.files : [];
        const account = result.caldav_account || (Array.isArray(result.caldav_accounts) ? result.caldav_accounts[0] : null) || null;
        this.caldavAccount = account;
        this.caldavAccounts = account ? [account] : [];
        this.notifyCalendarIndicatorChanged(result);
        if (this.selectedSource === "local" && this.selectedFileName && !this.files.some((file) => file?.name === this.selectedFileName)) this.closeIcsFile();
        if (this.selectedSource === "caldav" && (!this.caldavAccount ||
            (this.selectedCaldavAccountId && String(this.caldavAccount?.id || "") !== String(this.selectedCaldavAccountId)))) {
          this.closeCaldavCollection();
        }
        this.error = "";
        if (this.visible) window.requestAnimationFrame(() => this.syncPanelPlacement());
      },

      async createLocalCalendar() {
        const filename = window.prompt("Calendar filename", "local.ics");
        if (!filename) return;
        this.loading = true;
        this.error = "";
        try {
          const result = await callJsonApi("plugins/a0_superordinates/agent_calendar", {
            action: "create_ics",
            ctxid: this.ctxid || selectedContextId(),
            filename,
          });
          this.applyResult(result);
        } catch (error) {
          console.error("[Agent Calendar] Failed to create .ics file", error);
          this.error = String(error?.message || error || "Failed to create .ics file");
        } finally {
          this.loading = false;
        }
      },

        this.loading = true;

            action: "delete_ics",

      async openIcsFile(file) {

      async saveTodo() {
        if (!this.selectedFileName) {
          this.error = "Open a local .ics file first.";

        if (!String(this.todoForm?.summary || "").trim()) {

      async saveEvent() {

          this.error = "Open a local .ics file first.";

          this.error = "Start date is required.";

        this.syncRecurrenceRule();

          });

        } catch (error) {
          console.error("[Agent Calendar] Failed to save event", error);

        } finally {
          this.loading = false;

      async deleteEvent(uid) {

        if (!this.selectedFileName) return;

      _emptyCaldavForm() {
        return { label: "", server_url: "", webui_calendar_url: "", username: "", password: "" };
      },

      beginEditCaldavAccount() {
        const acc = this.caldavAccount || {};
        this.newCaldav = {
          label: String(acc.label || ""),
          server_url: String(acc.server_url || ""),
          webui_calendar_url: String(acc.webui_calendar_url || ""),
          username: String(acc.username || ""),
          password: "",
        };
        this.editingCaldavAccount = true;
      },

      cancelEditCaldavAccount() {
        this.newCaldav = this._emptyCaldavForm();
        this.editingCaldavAccount = false;
      },

      async addCaldavAccount() {
        const url = String(this.newCaldav?.server_url || "").trim();
        const webUrl = String(this.newCaldav?.webui_calendar_url || "").trim();
        const user = String(this.newCaldav?.username || "").trim();
        const pass = String(this.newCaldav?.password || "");
        if (!url || !user || !pass) {
          this.error = "CalDAV server URL, username, and password are required.";
          return;
        }
        if (webUrl && !/^https?:\/\//i.test(webUrl)) {
          this.error = "WebUI Calendar URL must start with http:// or https://.";
          return;
        }
        this.loading = true;
        this.error = "";
        try {
          const result = await callJsonApi("plugins/a0_superordinates/agent_calendar", {
            action: "set_caldav_account",
            ctxid: this.ctxid || selectedContextId(),
            label: String(this.newCaldav?.label || "").trim(),
            server_url: url,
            webui_calendar_url: webUrl,
            username: user,
            password: pass,
          });
          this.applyResult(result);
          if (!this.error) {
            const account = result?.caldav_account || result?.set || result?.added;
            this.newCaldav = this._emptyCaldavForm();
            this.editingCaldavAccount = false;
            // Auto-test the configured singleton so the user sees collection discovery immediately.
            if (account?.id) await this.testCaldavAccount();
          }
        } catch (error) {
          console.error("[Agent Calendar] Failed to configure CalDAV account", error);
          this.error = String(error?.message || error || "Failed to configure CalDAV account");
        } finally {
          this.loading = false;
        }
      },

      async removeCaldavAccount() {
        if (!this.caldavAccount) return;
        if (!window.confirm("Remove this CalDAV account?")) return;
        this.loading = true;
        this.error = "";
        try {
          const result = await callJsonApi("plugins/a0_superordinates/agent_calendar", {
            action: "remove_caldav_account",
            ctxid: this.ctxid || selectedContextId(),
          });
          this.closeCaldavCollection();
          this.newCaldav = this._emptyCaldavForm();
          this.editingCaldavAccount = false;
          this.applyResult(result);
        } catch (error) {
          console.error("[Agent Calendar] Failed to remove CalDAV account", error);
          this.error = String(error?.message || error || "Failed to remove CalDAV account");
        } finally {
          this.loading = false;
        }
      },

      async testCaldavAccount() {
        if (!this.caldavAccount) return;
        this.loading = true;
        this.error = "";
        try {
          const result = await callJsonApi("plugins/a0_superordinates/agent_calendar", {
            action: "test_caldav_account",
            ctxid: this.ctxid || selectedContextId(),
          });
          this.applyResult(result);
          const test = result?.test;
          if (test && test.ok === false) {
            this.error = test.error || "CalDAV verification failed.";
          }
        } catch (error) {
          console.error("[Agent Calendar] Failed to test CalDAV account", error);
          this.error = String(error?.message || error || "Failed to test CalDAV account");
        } finally {
          this.loading = false;
        }
      },

      async selectCaldavCollection(collectionUrl) {
        if (!this.caldavAccount || !collectionUrl) return;
        this.loading = true;
        this.error = "";
        try {
          const result = await callJsonApi("plugins/a0_superordinates/agent_calendar", {
            action: "select_caldav_collection",
            ctxid: this.ctxid || selectedContextId(),
            collection_url: collectionUrl,
          });
          this.applyResult(result);
        } catch (error) {
          console.error("[Agent Calendar] Failed to select CalDAV collection", error);
          this.error = String(error?.message || error || "Failed to select CalDAV collection");
        } finally {
          this.loading = false;
        }
      },

      _findCaldavAccount(id) {
        const acc = this.caldavAccount || null;
        if (!acc) return null;
        if (!id || String(acc?.id || "") === String(id || "")) return acc;
        return null;
      },

      async openCaldavCollection(id) {
        const acc = this._findCaldavAccount(id);
        if (!acc) return;
        if (!acc.selected_collection_url) {
          this.error = "Pick a CalDAV collection first.";
          return;
        }
        this.selectedCaldavAccountId = String(acc.id || "singleton");
        this.selectedCaldavCollectionLabel = acc.selected_collection_name || acc.selected_collection_url;
        this.selectedSource = "caldav";
        // Closing the local editor avoids cross-source confusion.
        this.closeIcsFile();
        await this.refreshCaldavEvents();
      },

      closeCaldavCollection() {
        this.selectedCaldavAccountId = "";
        this.selectedCaldavCollectionLabel = "";
        this.selectedCaldavHref = "";
        this.caldavEvents = [];
        if (this.selectedSource === "caldav") {
          this.selectedSource = "local";
          this.closeIcsFile();
        }
      },

      async refreshCaldavEvents() {
        if (!this.caldavAccount) return;
        this.loading = true;
        this.error = "";
        try {
          const result = await callJsonApi("plugins/a0_superordinates/agent_calendar", {
            action: "list_caldav_events",
            ctxid: this.ctxid || selectedContextId(),
          });
          if (result?.ok) {
            this.caldavEvents = Array.isArray(result.events) ? result.events : [];
          } else {
            this.error = result?.error || "Failed to list CalDAV events";
            this.caldavEvents = [];
          }
        } catch (error) {
          console.error("[Agent Calendar] Failed to list CalDAV events", error);
          this.error = String(error?.message || error || "Failed to list CalDAV events");
        } finally {
          this.loading = false;
        }
      },

      newCaldavEvent() {
        if (!this.caldavAccount) return;
        if (!this.selectedCaldavAccountId) this.selectedCaldavAccountId = String(this.caldavAccount.id || "singleton");
        this.selectedSource = "caldav";
        this.selectedFileName = `caldav:${this.selectedCaldavCollectionLabel || "new event"}`;
        this.selectedFile = { source: "caldav" };
        this.componentKind = "event";
        this.eventForm = this.defaultEventForm();
        this.todoForm = this.defaultTodoForm ? this.defaultTodoForm() : {};
        this.originalEventUid = "";
        this.originalTodoUid = "";
        this.selectedCaldavHref = "";
        if (this.visible) window.requestAnimationFrame(() => this.syncPanelPlacement());
      },

      async openCaldavEvent(ev) {
        if (!ev) return;
        this.loading = true;
        this.error = "";
        try {
          this.selectedSource = "caldav";
          this.selectedFileName = `caldav:${ev.summary || ev.uid || "event"}`;
          this.selectedFile = { source: "caldav", href: ev.href };
          this.selectedCaldavHref = ev.href || "";
          this.componentKind = ev.component_kind === "todo" ? "todo" : "event";
          // Seed the form from summary fields; full ICS round-trip is left to the
          // user editing in the structured form.  The save path will rebuild the
          // VEVENT/VTODO from the form values.
          if (this.componentKind === "event") {
            this.eventForm = this.normalizeEventForm({
              uid: ev.uid || "",
              summary: ev.summary || "",
              start_date: "",
              start_time: "",
              end_date: "",
              end_time: "",
              all_day: false,
              rrule: ev.rrule || "",
            });
            this.originalEventUid = String(ev.uid || "");
            this.todoForm = this.defaultTodoForm ? this.defaultTodoForm() : {};
          } else {
            this.todoForm = (this.normalizeTodoForm ? this.normalizeTodoForm({ uid: ev.uid || "", summary: ev.summary || "" }) : { uid: ev.uid || "", summary: ev.summary || "" });
            this.originalTodoUid = String(ev.uid || "");
            this.eventForm = this.defaultEventForm();
          }
          if (this.visible) window.requestAnimationFrame(() => this.syncPanelPlacement());
        } finally {
          this.loading = false;
        }
      },

      async saveCaldavEvent() {
        if (!this.caldavAccount) {
          this.error = "Configure a CalDAV account first.";
          return;
        }
        const isEvent = this.componentKind !== "todo";
        if (isEvent && !String(this.eventForm?.start_date || "").trim()) {
          this.error = "Start date is required.";
          return;
        }
        if (!isEvent && !String(this.todoForm?.summary || "").trim()) {
          this.error = "Summary is required.";
          return;
        }
        if (isEvent) this.syncRecurrenceRule();
        this.loading = true;
        this.error = "";
        try {
          const body = {
            action: "upsert_caldav_event",
            ctxid: this.ctxid || selectedContextId(),
            href: this.selectedCaldavHref || "",
          };
          if (isEvent) body.event = this.eventForm;
          else body.todo = this.todoForm;
          const result = await callJsonApi("plugins/a0_superordinates/agent_calendar", body);
          if (result?.ok) {
            this.selectedCaldavHref = result.href || this.selectedCaldavHref;
            await this.refreshCaldavEvents();
          } else {
            this.error = result?.error || "Failed to save CalDAV event";
          }
        } catch (error) {
          console.error("[Agent Calendar] Failed to save CalDAV event", error);
          this.error = String(error?.message || error || "Failed to save CalDAV event");
        } finally {
          this.loading = false;
        }
      },

      async deleteCaldavEvent(ev) {
        const href = ev?.href || this.selectedCaldavHref;
        if (!this.caldavAccount || !href) return;
        if (!window.confirm("Delete this CalDAV event?")) return;
        this.loading = true;
        this.error = "";
        try {
          const result = await callJsonApi("plugins/a0_superordinates/agent_calendar", {
            action: "delete_caldav_event",
            ctxid: this.ctxid || selectedContextId(),
            href,
          });
          if (result?.ok) {
            if (this.selectedCaldavHref && this.selectedCaldavHref === href) {
              this.selectedCaldavHref = "";
              this.selectedFileName = "";
              this.selectedFile = null;
            }
            await this.refreshCaldavEvents();
          } else {
            this.error = result?.error || "Failed to delete CalDAV event";
          }
        } catch (error) {
          console.error("[Agent Calendar] Failed to delete CalDAV event", error);
          this.error = String(error?.message || error || "Failed to delete CalDAV event");
        } finally {
          this.loading = false;
        }
      },
    });
  }

  if (window.Alpine) registerAgentCalendarStore();
  document.addEventListener("alpine:init", registerAgentCalendarStore, { once: true });
</script>
