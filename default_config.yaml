# A0 Superordinates default configuration
#
# These settings control which non-descendant relationships may be messaged
# through superordinate_message. Descendant messaging (children/grandchildren)
# remains enabled because it is the original/core behavior of the tool.

# Allow a child superordinate to message upward to its parent/grandparent/etc.
# Default is false for security. Direct children may still send the exact
# lightweight parent notification: "{ContextID} has a message for you."
allow_parent_messaging: false

# Allow superordinates sharing the same immediate parent to message each other.
# Default is false for security.
allow_sibling_messaging: false

# Keep hierarchy intermediary agents informed about routed messages.
# The From/source agent always receives a non-prompt context copy. When enabled,
# superordinate_message also logs non-prompt context copies to any hierarchy
# intermediaries between From and To. Default is true.
keep_everybody_in_the_loop: true

# Display name used when creating the special folder that receives closed chats/entities.
closed_entities_folder_name: "Closed Entities"

# Show the inheritance.md suffix indicator (📜) next to agent names in the Superordinates panel.
# Default is true.
display_inheritance_indicator: true

# Show the Scheduler calendar suffix indicator (🗓️) next to agent names in the Superordinates panel
# when a calendar exists without Scheduler prompt JSON. Default is true.
display_calendar_indicator: true

# Show the Scheduler calendar prompt suffix indicator (📅) next to agent names in the Superordinates panel
# when Scheduler prompt JSON exists. Default is true.
display_calendar_prompts_indicator: true

# Show a speaker icon beside the prompt input, between Send and Microphone, that mirrors
# the left Preferences → Speech toggle. Default is true.
display_prompt_speech_toggle: true

# Show context token counters in the chat input progress area, cloned from a0_context_monitor.
# Default is true.
display_context_counters: true

# Name/handle of the human/operator this Hero Handler orchestrator belongs to.
# When set and Hero Mode is enabled, the sidebar header is prefixed with this value
# (for example: "neurocis Heroes").
hero_handler_name: ""

# Hero Mode designated root superordinate.
# Disabled means normal chat-box routing. When set to a ROOT superordinate
# context id, input typed while focused on any non-Hero context is routed as a
# message from the designated Hero to that focused superordinate.
hero_mode_designated_hero: "Disabled"

# When Hero Mode routes direct input from the Hero into a focused non-Hero
# superordinate, set the reverse Reply value to Info instead of Prompt. This
# means the prompted superordinate still processes the direct prompt, but its
# completed response returns to the Hero as informational memory/context rather
# than prompting the Hero. Default is true.
hero_mode_replies_to_hero_informational: true

# Visible message body truncate size.
# Limits the length of message bodies shown in the visible chat row for:
#   - hierarchy intermediary observer deliveries
#   - source/From observer copies
#   - non-Info final TO recipient visible rows
# The underlying message content used for memory/context and prompt delivery is
# never truncated. Info-path final recipient visible rows are also unaffected.
# Set to 0 to disable visible truncation. Default is 1000 characters.
visible_message_body_truncate_size: 1000
