# A0 Superordinates default configuration
#
# These settings control which non-descendant relationships may be messaged
# through superordinate_message. Descendant messaging (children/grandchildren)
# remains enabled because it is the original/core behavior of the tool.

# Allow a child superordinate to message upward to its parent/grandparent/etc.
# Default is false for security. Direct children may still send the exact
# lightweight parent notification: "{ContextID} has a message for you."
allow_parent_messaging: false

# Allow superordinates sharing the same immediate parent to message each other.
# Default is false for security.
allow_sibling_messaging: false

# Seconds superordinate_message waits for the target reply before returning.
# If the target is still processing after this, use superordinate_getresponse later.
reply_wait_seconds: 5

# Display name used when creating the special folder that receives closed chats/entities.
closed_entities_folder_name: "Closed Entities"

# Show the inheritance.md suffix indicator (📜) next to agent names in the Superordinates panel.
# Default is true.
display_inheritance_indicator: true

# Show the Scheduler calendar suffix indicator (🗓️) next to agent names in the Superordinates panel
# when a calendar exists without Scheduler prompt JSON. Default is true.
display_calendar_indicator: true

# Show the Scheduler calendar prompt suffix indicator (📅) next to agent names in the Superordinates panel
# when Scheduler prompt JSON exists. Default is true.
display_calendar_prompts_indicator: true
