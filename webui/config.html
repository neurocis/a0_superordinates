<html>
<head>
    <title>A0 Superordinates Settings</title>
    <script type="module">
    import { callJsonApi } from "/js/api.js";

    window.a0SuperordinatesLoadHeroRootOptions = async function a0SuperordinatesLoadHeroRootOptions(host) {
        if (!host) return;
        host.heroRootOptionsLoading = true;
        host.heroRootOptionsError = '';
        try {
            const response = await callJsonApi("plugins/a0_superordinates/superordinate_hero_roots", {});
            const superordinates = window.Alpine?.store?.('superordinates');
            const msgOnlyIds = readMsgOnlyIds(superordinates);
            const roots = Array.isArray(response?.roots)
                ? response.roots
                : (Array.isArray(response?.options) ? response.options : []);

            const options = [];
            for (const root of roots) {
                const id = String(root?.id || root?.ctxid || '').trim();
                if (!id || msgOnlyIds.has(id)) continue;
                const name = String(root?.name || '').trim();
                const label = String(root?.label || (name ? `${name} (${id})` : id)).trim();
                options.push({ id, label });
            }
            host.heroRootOptions = options;
            populateHeroSelectOptions(host, options);
        } catch (error) {
            console.error('[Superordinates] Failed loading Hero Mode root options:', error);
            host.heroRootOptionsError = error?.message || 'Failed to load ROOT superordinates.';
            host.heroRootOptions = [];
            populateHeroSelectOptions(host, []);
        } finally {
            host.heroRootOptionsLoading = false;
        }
    };

    function normalizeName(value) {
        return String(value || '').trim().toLowerCase();
    }

    function displayNameFor(id, byId, map) {
        const ctx = byId.get(id) || {};
        const data = ctx?.data || ctx?.ctx?.data || {};
        const entry = map?.[id] || {};
        return ctx?.name
            || ctx?.title
            || ctx?.heading
            || ctx?.ctx?.name
            || data?.name
            || data?.title
            || entry?.name
            || entry?.title
            || '';
    }


    function populateHeroSelectOptions(host, options) {
        try {
            const select = host?.$refs?.heroModeSelect || document.querySelector('[data-a0-hero-mode-select="1"]');
            if (!select) return;

            // Preserve the persisted configured ContextID. Do not coerce it to
            // Disabled just because the options arrived late, the frontend store
            // is stale, or filtering temporarily omitted the selected Hero.
            const configured = String(host?.config?.hero_mode_designated_hero || '').trim();
            const selected = configured || String(select.value || 'Disabled').trim() || 'Disabled';

            while (select.options.length > 1) select.remove(1);
            for (const option of options) {
                const element = document.createElement('option');
                element.value = option.id;
                element.textContent = option.label;
                select.appendChild(element);
            }

            const hasSelectedOption = Array.from(select.options).some((option) => option.value === selected);
            if (!hasSelectedOption && selected && selected !== 'Disabled') {
                // Keep the saved ContextID visible/selectable even if it is not
                // in the current candidate list. This prevents the settings UI
                // from displaying Disabled while Hero Mode is actually active,
                // and prevents accidental overwrite on save.
                const preserved = document.createElement('option');
                preserved.value = selected;
                preserved.textContent = `Current Hero (${selected})`;
                preserved.dataset.a0PreservedHero = '1';
                select.appendChild(preserved);
            }

            select.value = selected && Array.from(select.options).some((option) => option.value === selected)
                ? selected
                : 'Disabled';

            // Only write the selected value back when it preserves the backend
            // config or the user explicitly has Disabled selected. Never replace
            // an existing configured ContextID with Disabled due to option load
            // timing/filtering.
            if (host?.config && (select.value !== 'Disabled' || !configured)) {
                host.config.hero_mode_designated_hero = select.value;
            }
        } catch (error) {
            console.error('[Superordinates] Failed populating Hero Mode select:', error);
        }
    }

    function readMsgOnlyIds(superordinates) {
        const ids = new Set();
        try {
            const blocked = superordinates?.msgMeBlockedNodes || {};
            for (const [id, value] of Object.entries(blocked)) {
                if (value) ids.add(id);
            }
        } catch (_error) {}

        try {
            const raw = window.localStorage?.getItem('sup_msgMeBlockedNodes');
            const parsed = raw ? JSON.parse(raw) : null;
            if (Array.isArray(parsed)) {
                for (const id of parsed) ids.add(String(id));
            } else if (parsed && typeof parsed === 'object') {
                for (const [id, value] of Object.entries(parsed)) {
                    if (value) ids.add(id);
                }
            }
        } catch (_error) {}
        return ids;
    }
</script>
</head>
<body>
    <div x-data="{ heroRootOptions: [], heroRootOptionsLoading: false, heroRootOptionsError: '', heroRootOptionsLoadedForConfig: false }" x-init="$nextTick(() => window.a0SuperordinatesLoadHeroRootOptions?.(this))" x-effect="if (config && !heroRootOptionsLoadedForConfig) { heroRootOptionsLoadedForConfig = true; window.a0SuperordinatesLoadHeroRootOptions?.(this) }">
        <template x-if="config">
            <div>
                <div class="section-title">A0 Superordinates</div>
                <div class="section-description">
                    Configure relationship permissions for <code>superordinate_message</code>.
                    Messaging descendants (children and grandchildren) remains enabled as the core behavior.
                </div>


                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Hero Mode - Designated Hero</div>
                        <div class="field-description">
                            Select <code>Disabled</code> for normal routing, or choose a ROOT superordinate
                            ContextID to make it the Hero. Names are shown only as labels and may be
                            renamed safely. When enabled, chat-box input typed while focused on a
                            non-Hero context is sent as a Hero-attributed message to that context, and
                            the Hero is pinned at the top of the ROOT list while selected.
                        </div>
                    </div>
                    <div class="field-control">
                        <select x-model="config.hero_mode_designated_hero" x-ref="heroModeSelect" data-a0-hero-mode-select="1">
                            <option value="Disabled">Disabled</option>
                        </select>
                        <div class="field-description" x-show="heroRootOptionsLoading">Loading ROOT superordinates…</div>
                        <div class="field-description" x-show="heroRootOptionsError" x-text="heroRootOptionsError"></div>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Allow Parent / Ancestor Messaging</div>
                        <div class="field-description">
                            When enabled, a superordinate can send <code>superordinate_message</code>
                            upward to its parent, grandparent, or another ancestor context.
                            Disable this to prevent child agents from messaging upward.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.allow_parent_messaging" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Allow Sibling Messaging</div>
                        <div class="field-description">
                            When enabled, superordinates with the same immediate parent may send
                            <code>superordinate_message</code> to each other. Disable this to restrict
                            peer-to-peer coordination between sibling agents.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.allow_sibling_messaging" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Display inheritance.md indicator</div>
                        <div class="field-description">
                            Show the <code>📜</code> suffix on agents that have local <code>inheritance.md</code> content.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.display_inheritance_indicator" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Display Calendar indicator</div>
                        <div class="field-description">
                            Show the <code>🗓️</code> suffix on agents that have Scheduler calendar state without prompt JSON.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.display_calendar_indicator" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Display Calendar Prompt(s) indicator</div>
                        <div class="field-description">
                            Show the <code>📅</code> suffix on agents that have Scheduler prompt JSON.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.display_calendar_prompts_indicator" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Reply wait seconds</div>
                        <div class="field-description">
                            Number of seconds <code>superordinate_message</code> waits for the target
                            context to reply before returning a timeout/check-later response.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number" min="1" max="600"
                            x-model.number="config.reply_wait_seconds" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Name of Closed Entities Folder</div>
                        <div class="field-description">
                            Display name used when creating the special folder that receives closed chats/entities.
                            Existing folders keep their stable identity by ID; this value controls the name used
                            when the folder must be created.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text"
                            x-model="config.closed_entities_folder_name"
                            placeholder="Closed Entities" />
                    </div>
                </div>
            </div>
        </template>
    </div>
</body>
</html>
