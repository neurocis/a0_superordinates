<html>
<head>
    <title>A0 Superordinates Settings</title>
    <script type="module">
    import { callJsonApi } from "/js/api.js";

    window.a0SuperordinatesLoadHeroRootOptions = async function a0SuperordinatesLoadHeroRootOptions(host) {
        if (!host) return;
        host.heroRootOptionsLoading = true;
        host.heroRootOptionsError = '';
        try {
            const response = await callJsonApi("plugins/a0_superordinates/superordinate_hero_roots", {});
            const superordinates = window.Alpine?.store?.('superordinates');
            const msgOnlyIds = readMsgOnlyIds(superordinates);
            const roots = Array.isArray(response?.roots)
                ? response.roots
                : (Array.isArray(response?.options) ? response.options : []);

            const options = [];
            for (const root of roots) {
                const id = String(root?.id || root?.ctxid || '').trim();
                if (!id || msgOnlyIds.has(id)) continue;
                const name = String(root?.name || '').trim();
                const label = String(root?.label || (name ? `${name} (${id})` : id)).trim();
                options.push({ id, label });
            }
            host.heroRootOptions = options;
            populateHeroSelectOptions(host, options);
            requestAnimationFrame(() => populateHeroSelectOptions(host, options));
        } catch (error) {
            console.error('[Superordinates] Failed loading Hero Mode root options:', error);
            host.heroRootOptionsError = error?.message || 'Failed to load ROOT superordinates.';
            host.heroRootOptions = [];
            populateHeroSelectOptions(host, []);
            requestAnimationFrame(() => populateHeroSelectOptions(host, []));
        } finally {
            host.heroRootOptionsLoading = false;
        }
    };

    function normalizeName(value) {
        return String(value || '').trim().toLowerCase();
    }

    function displayNameFor(id, byId, map) {
        const ctx = byId.get(id) || {};
        const data = ctx?.data || ctx?.ctx?.data || {};
        const entry = map?.[id] || {};
        return ctx?.name
            || ctx?.title
            || ctx?.heading
            || ctx?.ctx?.name
            || data?.name
            || data?.title
            || entry?.name
            || entry?.title
            || '';
    }


    window.a0SuperordinatesPopulateHeroSelectOptions = populateHeroSelectOptions;

    function populateHeroSelectOptions(host, options) {
        try {
            const select = host?.$refs?.heroModeSelect || document.querySelector('[data-a0-hero-mode-select="1"]');
            if (!select) return;

            // Preserve the persisted configured ContextID. Do not coerce it to
            // Disabled just because the options arrived late, the frontend store
            // is stale, or filtering temporarily omitted the selected Hero.
            const configured = String(
                host?.config?.hero_mode_designated_hero
                || select.getAttribute('data-a0-hero-current')
                || ''
            ).trim();
            const selected = configured || String(select.value || 'Disabled').trim() || 'Disabled';
            rememberInitialHeroModeValue(selected);

            while (select.options.length > 1) select.remove(1);
            for (const option of options) {
                const element = document.createElement('option');
                element.value = option.id;
                element.textContent = option.label;
                select.appendChild(element);
            }

            const hasSelectedOption = Array.from(select.options).some((option) => option.value === selected);
            if (!hasSelectedOption && selected && selected !== 'Disabled') {
                // Keep the saved ContextID visible/selectable even if it is not
                // in the current candidate list. This prevents the settings UI
                // from displaying Disabled while Hero Mode is actually active,
                // and prevents accidental overwrite on save.
                const preserved = document.createElement('option');
                preserved.value = selected;
                preserved.textContent = `Current Hero (${selected})`;
                preserved.dataset.a0PreservedHero = '1';
                select.appendChild(preserved);
            }

            select.value = selected && Array.from(select.options).some((option) => option.value === selected)
                ? selected
                : 'Disabled';

            // Only write the selected value back when it preserves the backend
            // config or the user explicitly has Disabled selected. Never replace
            // an existing configured ContextID with Disabled due to option load
            // timing/filtering.
            if (host?.config && (select.value !== 'Disabled' || !configured)) {
                host.config.hero_mode_designated_hero = select.value;
            }
        } catch (error) {
            console.error('[Superordinates] Failed populating Hero Mode select:', error);
        }
    }

    function readMsgOnlyIds(superordinates) {
        const ids = new Set();
        try {
            const blocked = superordinates?.msgMeBlockedNodes || {};
            for (const [id, value] of Object.entries(blocked)) {
                if (value) ids.add(id);
            }
        } catch (_error) {}

        try {
            const raw = window.localStorage?.getItem('sup_msgMeBlockedNodes');
            const parsed = raw ? JSON.parse(raw) : null;
            if (Array.isArray(parsed)) {
                for (const id of parsed) ids.add(String(id));
            } else if (parsed && typeof parsed === 'object') {
                for (const [id, value] of Object.entries(parsed)) {
                    if (value) ids.add(id);
                }
            }
        } catch (_error) {}
        return ids;
    }

    // Capture the Hero selection as it was when this settings UI loaded. The
    // plugin-only save hook below compares against this value so no core
    // framework changes are required.
    function rememberInitialHeroModeValue(value) {
        try {
            if (window.__a0SuperHeroInitialValue !== undefined) return;
            const normalized = String(value || 'Disabled').trim() || 'Disabled';
            window.__a0SuperHeroInitialValue = normalized;
        } catch (_error) {}
    }

    // Force a full UI rebuild when Hero Mode designated Hero actually changes,
    // and only after the existing /plugins save_config request succeeds. This
    // wraps fetch defensively from the plugin config screen, avoids any core
    // framework modifications, and does not reload on unrelated settings edits.
    (function setupHeroModeReloadOnChange() {
        try {
            if (window.__a0SuperHeroReloadHookInstalled) return;
            if (typeof window.fetch !== 'function') return;
            window.__a0SuperHeroReloadHookInstalled = true;
            const originalFetch = window.fetch.bind(window);
            window.fetch = async function a0SuperHeroReloadFetchWrapper(input, init) {
                const response = await originalFetch(input, init);
                try {
                    const url = typeof input === 'string' ? input : String(input?.url || '');
                    const method = String(init?.method || input?.method || 'GET').toUpperCase();
                    if (method !== 'POST' || !url.includes('/plugins')) return response;

                    const body = typeof init?.body === 'string' ? init.body : '';
                    if (!body) return response;
                    const payload = JSON.parse(body);
                    if (payload?.action !== 'save_config' || payload?.plugin_name !== 'a0_superordinates') return response;

                    const previousHero = String(window.__a0SuperHeroInitialValue ?? 'Disabled') || 'Disabled';
                    const nextHero = String(payload?.settings?.hero_mode_designated_hero ?? 'Disabled') || 'Disabled';
                    const result = await response.clone().json().catch(() => null);
                    if (!response.ok || result?.ok === false) return response;

                    try {
                        const superordinates = window.Alpine?.store?.('superordinates');
                        if (superordinates && Object.prototype.hasOwnProperty.call(payload?.settings || {}, 'display_prompt_speech_toggle')) {
                            superordinates.displayPromptSpeechToggle = payload.settings.display_prompt_speech_toggle !== false;
                        }
                        if (superordinates && Object.prototype.hasOwnProperty.call(payload?.settings || {}, 'display_context_counters')) {
                            superordinates.displayContextCounters = payload.settings.display_context_counters !== false;
                            const counters = window.Alpine?.store?.('superordinateContextCounters');
                            if (superordinates.displayContextCounters) {
                                counters?.mountCounterDisplay?.();
                                counters?.fetchCounterData?.();
                            } else {
                                counters?.unmountCounterDisplay?.();
                            }
                        }
                    } catch (_storeError) {}

                    if (previousHero !== nextHero) {
                        setTimeout(() => { try { window.location.reload(); } catch (_e) {} }, 250);
                    }
                } catch (_error) {}
                return response;
            };
        } catch (_outer) {}
    })();
</script>
</head>
<body>
    <div x-data="{ heroRootOptions: [], heroRootOptionsLoading: false, heroRootOptionsError: '', heroRootOptionsLoadingStarted: false }" x-init="$nextTick(() => window.a0SuperordinatesLoadHeroRootOptions?.(this))" x-effect="if (config && !heroRootOptionsLoadingStarted) { heroRootOptionsLoadingStarted = true; $nextTick(() => window.a0SuperordinatesLoadHeroRootOptions?.(this)) }">
        <template x-if="config">
            <div>
                <div class="section-title">A0 Superordinates</div>
                <div class="section-description">
                    Configure relationship permissions for <code>superordinate_message</code>.
                    Messaging descendants (children and grandchildren) remains enabled as the core behavior.
                </div>


                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Hero Mode - Designated Hero</div>
                        <div class="field-description">
                            Select <code>Disabled</code> for normal routing, or choose a ROOT superordinate
                            ContextID to make it the Hero. Names are shown only as labels and may be
                            renamed safely. When enabled, chat-box input typed while focused on a
                            non-Hero context is sent as a Hero-attributed message to that context, and
                            the Hero is pinned at the top of the ROOT list while selected.
                        </div>
                    </div>
                    <div class="field-control">
                        <select
                            x-model="config.hero_mode_designated_hero"
                            x-ref="heroModeSelect"
                            data-a0-hero-mode-select="1"
                            :data-a0-hero-current="config.hero_mode_designated_hero || 'Disabled'"
                            x-init="$nextTick(() => window.a0SuperordinatesPopulateHeroSelectOptions?.(this, heroRootOptions || []))"
                            x-effect="if (config) { $nextTick(() => window.a0SuperordinatesPopulateHeroSelectOptions?.(this, heroRootOptions || [])) }"
                        >
                            <option value="Disabled">Disabled</option>
                            <option
                                x-show="config.hero_mode_designated_hero && config.hero_mode_designated_hero !== 'Disabled'"
                                :value="config.hero_mode_designated_hero"
                                x-text="'Current Hero (' + config.hero_mode_designated_hero + ')'"
                            ></option>
                        </select>
                        <div class="field-description" x-show="heroRootOptionsLoading">Loading ROOT superordinates…</div>
                        <div class="field-description" x-show="heroRootOptionsError" x-text="heroRootOptionsError"></div>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Set replies to the Hero from a prompted Superordinate to Informational</div>
                        <div class="field-description">
                            When Hero Mode routes a direct prompt from the Hero into the focused non-Hero
                            superordinate, send it with <code>reply: "Info"</code> instead of
                            <code>reply: "Prompt"</code>. The focused superordinate is still prompted,
                            but its completed response returns to the Hero as informational memory/context
                            instead of prompting the Hero. Default is enabled.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.hero_mode_replies_to_hero_informational" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Allow Parent / Ancestor Messaging</div>
                        <div class="field-description">
                            When enabled, a superordinate can send <code>superordinate_message</code>
                            upward to its parent, grandparent, or another ancestor context.
                            Disable this to prevent child agents from messaging upward.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.allow_parent_messaging" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Allow Sibling Messaging</div>
                        <div class="field-description">
                            When enabled, superordinates with the same immediate parent may send
                            <code>superordinate_message</code> to each other normally. When disabled,
                            sibling messages are downgraded to full context-only <code>Info</code>
                            delivery, so the sibling sees the message in memory/context but is not prompted.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.allow_sibling_messaging" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Keep everybody in the loop</div>
                        <div class="field-description">
                            The From/source agent always gets a non-prompt context copy. When enabled,
                            <code>superordinate_message</code> also logs non-prompt context copies to
                            hierarchy intermediaries between From and To. Disable this to exclude only
                            those hierarchy intermediaries.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.keep_everybody_in_the_loop" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Display inheritance.md indicator</div>
                        <div class="field-description">
                            Show the <code>📜</code> suffix on agents that have local <code>inheritance.md</code> content.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.display_inheritance_indicator" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Display Calendar indicator</div>
                        <div class="field-description">
                            Show the <code>🗓️</code> suffix on agents that have Scheduler calendar state without prompt JSON.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.display_calendar_indicator" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Display Calendar Prompt(s) indicator</div>
                        <div class="field-description">
                            Show the <code>📅</code> suffix on agents that have Scheduler prompt JSON.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.display_calendar_prompts_indicator" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Display prompt speech toggle</div>
                        <div class="field-description">
                            Show a speaker icon beside the prompt input, between Send and Microphone.
                            The button mirrors the left Preferences → Speech toggle.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.display_prompt_speech_toggle" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Display context counters</div>
                        <div class="field-description">
                            Show context token counters in the chat input progress area, cloned from
                            <code>a0_context_monitor</code>: <code>SYS</code>, <code>CTX</code>,
                            <code>PRM</code>, and <code>RES</code>.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.display_context_counters" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Name of Closed Entities Folder</div>
                        <div class="field-description">
                            Display name used when creating the special folder that receives closed chats/entities.
                            Existing folders keep their stable identity by ID; this value controls the name used
                            when the folder must be created.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text"
                            x-model="config.closed_entities_folder_name"
                            placeholder="Closed Entities" />
                    </div>
                </div>
            </div>
        </template>
    </div>
</body>
</html>
